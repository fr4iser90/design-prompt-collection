<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Titanium Oxide Bloom — Thin-Film Interference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#1A1A1A;
    --ink:#8A95A5;
    --ink-dim:#565e69;
    --accent:#6420B0;
    --accent-soft:#7b3fd6;
    --mono:'DM Mono', ui-monospace, monospace;
    --serif:'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; z-index:0;
    cursor:grab; touch-action:none;
  }
  #scene:active{cursor:grabbing;}

  /* ---- UI overlay ---- */
  .ui{position:fixed; inset:0; z-index:2; pointer-events:none;}

  .title{
    position:absolute; top:clamp(18px,3.4vw,42px); left:clamp(18px,3.4vw,44px);
    font-family:var(--serif); font-weight:600;
    font-size:clamp(1.5rem,3.2vw,2.5rem);
    letter-spacing:.05em; line-height:1;
    color:#aeb6c2; text-shadow:0 1px 24px rgba(0,0,0,.45);
    user-select:none;
  }
  .title span{display:block; font-size:.5em; font-weight:400; letter-spacing:.28em;
    color:var(--ink-dim); margin-top:.55em; text-transform:uppercase;}

  .panel{
    position:absolute; left:clamp(18px,3.4vw,44px); bottom:clamp(20px,3.4vw,44px);
    width:min(340px,72vw); pointer-events:auto;
    user-select:none;
  }
  .label{
    font-size:.72rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:14px; display:flex; align-items:center; gap:9px;
  }
  .label::before{content:""; width:6px; height:6px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 10px var(--accent);
    animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  .readout{display:flex; align-items:baseline; gap:.35em; margin-bottom:2px;}
  .temp{font-size:clamp(2.4rem,6.5vw,3.4rem); font-weight:500; color:#cdd3db;
    line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  .unit{font-size:1.15rem; color:var(--ink); font-weight:400;}
  .sub{font-size:.85rem; color:var(--ink-dim); margin-bottom:22px;
    font-variant-numeric:tabular-nums;}
  .sub b{color:var(--ink); font-weight:500;}

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:2px; background:var(--ink); border-radius:2px;
    outline:none; cursor:pointer; margin:6px 0 12px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%; background:var(--accent);
    border:2px solid #1A1A1A; box-shadow:0 0 0 1px var(--accent), 0 0 16px rgba(100,32,176,.65);
    transition:transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22);}
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.05);}
  input[type=range]::-moz-range-track{height:2px; background:var(--ink); border-radius:2px;}
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; background:var(--accent);
    border:2px solid #1A1A1A; box-shadow:0 0 0 1px var(--accent), 0 0 16px rgba(100,32,176,.65);}

  .scale{display:flex; justify-content:space-between; font-size:.66rem;
    color:var(--ink-dim); letter-spacing:.14em; font-variant-numeric:tabular-nums;}

  .meta{
    position:absolute; right:clamp(18px,3.4vw,44px); bottom:clamp(20px,3.4vw,44px);
    text-align:right; font-size:.68rem; line-height:1.9; color:var(--ink-dim);
    letter-spacing:.06em; max-width:44vw; user-select:none;
  }
  .meta .k{color:var(--ink);}
  .meta .hint{margin-top:8px; opacity:.7;}

  @media (max-width:640px){
    .meta{display:none;}
    .panel{width:min(320px,86vw);}
  }
  @media (prefers-reduced-motion:reduce){
    .label::before{animation:none; opacity:.8;}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="ui">
    <div class="title">Titanium Oxide Bloom<span>Thin-Film Interference · Anodization Lab</span></div>

    <div class="panel">
      <div class="label">Temperature</div>
      <div class="readout"><span class="temp" id="tempVal">200</span><span class="unit">°C</span></div>
      <div class="sub"><b id="thickVal">~20</b> nm oxide · <span id="hueVal">Straw</span></div>
      <input type="range" id="slider" min="200" max="600" step="1" value="200" aria-label="Anodization temperature" />
      <div class="scale"><span>200°</span><span>400°</span><span>600°</span></div>
    </div>

    <div class="meta">
      <div><span class="k">n(TiO₂)</span> = 2.40 · λ 650/510/450 nm</div>
      <div><span class="k">δ</span> = 4πn·d·cosθₜ / λ</div>
      <div class="hint">Drag to orbit — hue shifts with viewing angle</div>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Renderer ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------- Scene / Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1A1A1A);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(2.6, 2.0, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.4;
controls.maxDistance = 8;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0, 0);

/* ---------- Lights (no HDRI) ---------- */
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

scene.add(new THREE.AmbientLight(0xffffff, 0.2));

/* ---------- Procedural floor (subtle, to receive shadow) ---------- */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x141414, roughness:1.0, metalness:0.0 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.05;
floor.receiveShadow = true;
scene.add(floor);

/* ---------- Titanium plate (shallow dish, 128x128) ---------- */
const geo = new THREE.PlaneGeometry(3, 3, 128, 128);
{
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i);
    const r2 = x*x + y*y;
    pos.setZ(i, -0.12 * r2); // gentle organic curvature
  }
  geo.computeVertexNormals();
}

const material = new THREE.MeshPhysicalMaterial({
  color: 0x8A95A5,
  metalness: 1.0,
  roughness: 0.3,
  envMapIntensity: 1.0
});

const uniforms = {
  uTemperature: { value: 200.0 },
  uTime:        { value: 0.0 },
  uSpark:       { value: 0.0 },
  uSparkPos:    { value: new THREE.Vector2(0, 0) }
};

material.onBeforeCompile = (shader) => {
  shader.uniforms.uTemperature = uniforms.uTemperature;
  shader.uniforms.uTime        = uniforms.uTime;
  shader.uniforms.uSpark       = uniforms.uSpark;
  shader.uniforms.uSparkPos    = uniforms.uSparkPos;

  /* ---- Vertex: thermal shimmer displacement ---- */
  shader.vertexShader =
    'uniform float uTime;\nuniform float uTemperature;\n' +
    shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      #include <begin_vertex>
      float heat = clamp((uTemperature - 200.0) / 400.0, 0.0, 1.0);
      float shimmer = sin(position.x * 12.0 + uTime * 31.4159)
                    * cos(position.y * 11.0 - uTime * 24.0);
      transformed += normal * shimmer * 0.0008 * heat;
      `
    );

  /* ---- Fragment: thin-film interference ---- */
  shader.fragmentShader =
    'uniform float uTemperature;\nuniform float uTime;\nuniform float uSpark;\nuniform vec2 uSparkPos;\n' +
    shader.fragmentShader.replace(
      '#include <map_fragment>',
      `
      #include <map_fragment>

      // --- oxide thickness from temperature (nm) ---
      float t   = clamp((uTemperature - 200.0) / 400.0, 0.0, 1.0);
      float d   = 20.0 + 40.0 * t;                 // 200°C=20nm  600°C=60nm

      // --- entrance spark: localized transient thickness boost ---
      float sparkDist = length(vUv - uSparkPos);
      float boost = exp(-sparkDist * sparkDist * 55.0) * uSpark * 35.0;
      d += boost;

      // --- thin-film interference ---
      float n = 2.4;                                // TiO2 refractive index
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewPosition);
      float cosThetaI = clamp(dot(N, V), 0.0, 1.0); // view-space angle to normal
      float cosThetaT = sqrt(max(0.0, 1.0 - (1.0 - cosThetaI * cosThetaI) / (n * n))); // Snell

      // wavelengths (nm): R=650 G=510 B=450
      vec3 lambda = vec3(650.0, 510.0, 450.0);
      float delta = (4.0 * 3.141592653589793 * n * d * cosThetaT) / lambda;
      vec3 I = cos(delta) * cos(delta);

      // Fresnel-weighted mix (stronger film colour at grazing angles)
      float fres = pow(1.0 - cosThetaI, 3.0);
      vec3 film = mix(vec3(1.0), I, 0.5 + 0.5 * fres);

      diffuseColor.rgb *= film;
      `
    );
};

const plate = new THREE.Mesh(geo, material);
plate.rotation.x = -Math.PI / 2;
plate.castShadow = true;
plate.receiveShadow = true;
scene.add(plate);

/* ---------- UI wiring ---------- */
const slider   = document.getElementById('slider');
const tempVal  = document.getElementById('tempVal');
const thickVal = document.getElementById('thickVal');
const hueVal   = document.getElementById('hueVal');

function hueName(temp){
  if (temp < 250) return 'Straw';
  if (temp < 320) return 'Purple';
  if (temp < 400) return 'Blue';
  if (temp < 480) return 'Green';
  if (temp < 540) return 'Grey-Green';
  return 'Thick Grey';
}

function applyTemp(temp, fromUI){
  uniforms.uTemperature.value = temp;
  tempVal.textContent  = Math.round(temp);
  thickVal.textContent = '~' + Math.round(20 + 40 * (temp - 200) / 400);
  hueVal.textContent   = hueName(temp);
  if (fromUI) slider.value = Math.round(temp);
}

slider.addEventListener('input', () => {
  introDone = true;
  applyTemp(parseFloat(slider.value), false);
});

/* ---------- Animation ---------- */
let introDone = false;
const introStart = 200, introEnd = 300;
const introDur = reduceMotion ? 0 : 2.0;
let introElapsed = 0;

let sparkElapsed = 0;
const sparkDur = reduceMotion ? 0 : 1.8;
const sparkStart = 0.3;

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  uniforms.uTime.value += dt;

  // Entrance temperature sweep
  if (!introDone){
    introElapsed += dt;
    const p = introDur > 0 ? Math.min(introElapsed / introDur, 1) : 1;
    const eased = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
    applyTemp(introStart + (introEnd - introStart) * eased, true);
    if (p >= 1) introDone = true;
  }

  // Spark travelling across the plate
  sparkElapsed += dt;
  if (sparkElapsed > sparkStart && sparkElapsed < sparkStart + sparkDur){
    const sp = (sparkElapsed - sparkStart) / sparkDur;
    uniforms.uSparkPos.value.set(sp, 0.5 + 0.14 * Math.sin(sp * Math.PI * 2));
    uniforms.uSpark.value = Math.sin(sp * Math.PI); // 0 -> 1 -> 0
  } else {
    uniforms.uSpark.value = 0.0;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
