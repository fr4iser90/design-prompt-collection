<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ink Dissolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#F8F9FA;}
  body{font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;cursor:crosshair;}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;}

  .brand{
    position:fixed;top:clamp(22px,4vw,58px);left:clamp(22px,4vw,58px);
    font-family:'Merriweather',serif;font-weight:300;
    font-size:clamp(34px,6.2vw,90px);line-height:.98;letter-spacing:-.025em;
    color:#1A1A1A;mix-blend-mode:multiply;pointer-events:none;user-select:none;z-index:10;
    text-shadow:0 1px 0 rgba(248,249,250,.35);
  }
  .brand .it{font-style:italic;font-weight:400;}
  .brand-sub{
    margin-top:.75em;font-family:'IBM Plex Mono',monospace;font-weight:400;
    font-size:clamp(9px,1vw,11px);letter-spacing:.34em;text-transform:uppercase;
    color:#4A5568;opacity:.85;
  }

  .hint{
    position:fixed;left:clamp(22px,4vw,58px);bottom:clamp(22px,4vw,46px);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
    color:#1A1A1A;opacity:.55;pointer-events:none;user-select:none;z-index:10;
    transition:opacity .8s ease;
  }
  .hint.hide{opacity:0;}

  .stats{
    position:fixed;right:clamp(16px,3vw,30px);bottom:clamp(16px,3vw,26px);
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.85;
    letter-spacing:.04em;color:#1A1A1A;opacity:.48;pointer-events:none;user-select:none;
    text-align:right;z-index:10;
  }
  .stats .k{color:#4A5568;}

  .fade-in{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .fallback{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#F8F9FA;color:#1A1A1A;font-family:'IBM Plex Mono',monospace;
    font-size:13px;letter-spacing:.05em;text-align:center;padding:24px;z-index:20;
  }

  @media (prefers-reduced-motion: reduce){
    .fade-in{animation:none;}
  }
</style>
</head>
<body>
  <div class="brand fade-in">Ink <span class="it">Dissolve</span>
    <div class="brand-sub">sumi&nbsp;·&nbsp;navier–stokes&nbsp;·&nbsp;glsl</div>
  </div>

  <div class="hint fade-in" id="hint">drag to release the ink</div>

  <div class="stats fade-in" id="stats">
    <div><span class="k">fps</span> <span id="s-fps">--</span></div>
    <div><span class="k">grid</span> <span id="s-grid">--</span></div>
    <div><span class="k">solver</span> <span id="s-solver">--</span></div>
  </div>

  <div class="fallback" id="fallback">WebGL is required to render the ink simulation.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function(){
    "use strict";

    var canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    var renderer;
    try{
      renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:false, alpha:false, powerPreference:'high-performance'});
    }catch(e){
      document.getElementById('fallback').style.display='flex';
      return;
    }
    if(!renderer){ document.getElementById('fallback').style.display='flex'; return; }

    // ---- float / half-float support detection ----
    function getFloatType(){
      var gl = renderer.getContext();
      var extHalf = gl.getExtension('OES_texture_half_float');
      var extHalfLinear = gl.getExtension('OES_texture_half_float_linear');
      var extFloat = gl.getExtension('OES_texture_float');
      var extFloatLinear = gl.getExtension('OES_texture_float_linear');
      var half = (typeof THREE.HalfFloatType !== 'undefined') ? THREE.HalfFloatType : THREE.FloatType;
      if(extHalf && extHalfLinear) return half;
      if(extHalf) return half;
      if(extFloat && extFloatLinear) return THREE.FloatType;
      if(extFloat) return THREE.FloatType;
      return THREE.UnsignedByteType;
    }
    var SIM_TYPE = getFloatType();
    var solverLabel = (SIM_TYPE === THREE.FloatType) ? 'float32'
                    : (SIM_TYPE === THREE.HalfFloatType ? 'half-float' : 'byte8');

    var rendererOK = true;
    try{
      var testRT = new THREE.WebGLRenderTarget(8,8,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,type:SIM_TYPE});
      renderer.setRenderTarget(testRT);
      renderer.render(new THREE.Scene(), new THREE.Camera());
      renderer.setRenderTarget(null);
    }catch(e){
      rendererOK = false; SIM_TYPE = THREE.UnsignedByteType; solverLabel = 'byte8';
    }

    // ---- resolution tiers ----
    var SIM_RES = 256;
    if(window.innerWidth >= 1000 && window.innerHeight >= 600 && rendererOK) SIM_RES = 512;
    var PRESSURE_ITERATIONS = 20;

    var maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

    // ---- shared quad scene ----
    var quadScene = new THREE.Scene();
    var quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    var quadGeo = new THREE.PlaneGeometry(2,2);
    var quadMesh = new THREE.Mesh(quadGeo, new THREE.MeshBasicMaterial());
    quadMesh.frustumCulled = false;
    quadScene.add(quadMesh);

    // ---- shader sources ----
    var VERT = [
      'precision highp float;',
      'varying vec2 vUv;',
      'void main(){',
      '  vUv = uv;',
      '  gl_Position = vec4(position.xy, 0.0, 1.0);',
      '}'
    ].join('\n');

    var FRAG_COPY = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uTexture;',
      'uniform float uScale;',
      'void main(){ gl_FragColor = vec4(texture2D(uTexture, vUv).rgb * uScale, 1.0); }'
    ].join('\n');

    var FRAG_CLEAR = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uTexture;',
      'uniform float uValue;',
      'void main(){ gl_FragColor = vec4(texture2D(uTexture, vUv).rgb * uValue, 1.0); }'
    ].join('\n');

    var FRAG_SPLAT = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uTarget;',
      'uniform float aspectRatio;',
      'uniform vec3 color;',
      'uniform vec2 point;',
      'uniform float radius;',
      'void main(){',
      '  vec2 p = vUv - point;',
      '  p.x *= aspectRatio;',
      '  vec3 splat = exp(-dot(p,p) / radius) * color;',
      '  vec3 base = texture2D(uTarget, vUv).rgb;',
      '  gl_FragColor = vec4(base + splat, 1.0);',
      '}'
    ].join('\n');

    var FRAG_ADVECT = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uVelocity;',
      'uniform sampler2D uSource;',
      'uniform vec2 texelSize;',
      'uniform float dt;',
      'uniform float dissipation;',
      'void main(){',
      '  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;',
      '  vec3 result = texture2D(uSource, coord).rgb;',
      '  float decay = 1.0 + dissipation * dt;',
      '  gl_FragColor = vec4(result / decay, 1.0);',
      '}'
    ].join('\n');

    var FRAG_DIVERGENCE = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uVelocity;',
      'uniform vec2 texelSize;',
      'void main(){',
      '  float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).x;',
      '  float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).x;',
      '  float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).y;',
      '  float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).y;',
      '  float div = 0.5 * (R - L + T - B);',
      '  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);',
      '}'
    ].join('\n');

    var FRAG_PRESSURE = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uPressure;',
      'uniform sampler2D uDivergence;',
      'uniform vec2 texelSize;',
      'void main(){',
      '  float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;',
      '  float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;',
      '  float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;',
      '  float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;',
      '  float divergence = texture2D(uDivergence, vUv).x;',
      '  float pressure = (L + R + B + T - divergence) * 0.25;',
      '  gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);',
      '}'
    ].join('\n');

    var FRAG_GRADIENT_SUB = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uPressure;',
      'uniform sampler2D uVelocity;',
      'uniform vec2 texelSize;',
      'void main(){',
      '  float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;',
      '  float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;',
      '  float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;',
      '  float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;',
      '  vec2 velocity = texture2D(uVelocity, vUv).xy;',
      '  velocity.xy -= vec2(R - L, T - B);',
      '  gl_FragColor = vec4(velocity, 0.0, 1.0);',
      '}'
    ].join('\n');

    var FRAG_CURL = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uVelocity;',
      'uniform vec2 texelSize;',
      'void main(){',
      '  float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).y;',
      '  float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).y;',
      '  float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).x;',
      '  float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).x;',
      '  float vorticity = R - L - T + B;',
      '  gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);',
      '}'
    ].join('\n');

    var FRAG_VORTICITY = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uVelocity;',
      'uniform sampler2D uCurl;',
      'uniform vec2 texelSize;',
      'uniform float curl;',
      'uniform float dt;',
      'void main(){',
      '  float L = texture2D(uCurl, vUv - vec2(texelSize.x, 0.0)).x;',
      '  float R = texture2D(uCurl, vUv + vec2(texelSize.x, 0.0)).x;',
      '  float T = texture2D(uCurl, vUv + vec2(0.0, texelSize.y)).x;',
      '  float B = texture2D(uCurl, vUv - vec2(0.0, texelSize.y)).x;',
      '  float C = texture2D(uCurl, vUv).x;',
      '  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));',
      '  force /= length(force) + 0.0001;',
      '  force *= curl * C;',
      '  force.y *= -1.0;',
      '  vec2 velocity = texture2D(uVelocity, vUv).xy;',
      '  velocity += force * dt;',
      '  velocity = clamp(velocity, -1000.0, 1000.0);',
      '  gl_FragColor = vec4(velocity, 0.0, 1.0);',
      '}'
    ].join('\n');

    // Display: sumi ink over water, matte & opaque at core, translucent at edges
    var FRAG_DISPLAY = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D uDensity;',
      'void main(){',
      '  float d = texture2D(uDensity, vUv).x;',
      '  d = clamp(d, 0.0, 1.0);',
      '  vec3 water = vec3(0.9725, 0.9765, 0.9804);',      // #F8F9FA
      '  vec3 ink   = vec3(0.1020, 0.1020, 0.1020);',      // #1A1A1A
      '  vec3 shadow= vec3(0.2902, 0.3333, 0.4078);',      // #4A5568
      '  float t = clamp(d * 2.4, 0.0, 1.0);',
      '  vec3 diluted = mix(water, shadow, t);',
      '  float core = smoothstep(0.45, 0.98, d);',
      '  vec3 col = mix(diluted, ink, core);',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    // ---- program factory ----
    function createProgram(frag, uniforms){
      var mat = new THREE.ShaderMaterial({
        vertexShader: VERT,
        fragmentShader: frag,
        uniforms: uniforms,
        depthTest: false,
        depthWrite: false
      });
      return { material: mat, mesh: new THREE.Mesh(quadGeo, mat) };
    }

    var copyProg = createProgram(FRAG_COPY, {
      uTexture:{value:null}, uScale:{value:1.0}
    });
    var clearProg = createProgram(FRAG_CLEAR, {
      uTexture:{value:null}, uValue:{value:0.0}
    });
    var splatProg = createProgram(FRAG_SPLAT, {
      uTarget:{value:null}, aspectRatio:{value:1.0}, color:{value:new THREE.Vector3()},
      point:{value:new THREE.Vector2()}, radius:{value:0.0001}
    });
    var advectProg = createProgram(FRAG_ADVECT, {
      uVelocity:{value:null}, uSource:{value:null}, texelSize:{value:new THREE.Vector2()},
      dt:{value:0.016}, dissipation:{value:0.0}
    });
    var divergenceProg = createProgram(FRAG_DIVERGENCE, {
      uVelocity:{value:null}, texelSize:{value:new THREE.Vector2()}
    });
    var pressureProg = createProgram(FRAG_PRESSURE, {
      uPressure:{value:null}, uDivergence:{value:null}, texelSize:{value:new THREE.Vector2()}
    });
    var gradientProg = createProgram(FRAG_GRADIENT_SUB, {
      uPressure:{value:null}, uVelocity:{value:null}, texelSize:{value:new THREE.Vector2()}
    });
    var curlProg = createProgram(FRAG_CURL, {
      uVelocity:{value:null}, texelSize:{value:new THREE.Vector2()}
    });
    var vorticityProg = createProgram(FRAG_VORTICITY, {
      uVelocity:{value:null}, uCurl:{value:null}, texelSize:{value:new THREE.Vector2()},
      curl:{value:0.0}, dt:{value:0.016}
    });
    var displayProg = createProgram(FRAG_DISPLAY, {
      uDensity:{value:null}
    });

    // ---- ping-pong buffers ----
    function makeDouble(res){
      var o = {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat,
        type: SIM_TYPE,
        wrapS: THREE.ClampToEdgeWrapping,
        wrapT: THREE.ClampToEdgeWrapping
      };
      return {
        read:  new THREE.WebGLRenderTarget(res, res, o),
        write: new THREE.WebGLRenderTarget(res, res, o),
        swap: function(){ var t=this.read; this.read=this.write; this.write=t; }
      };
    }
    function makeSingle(res){
      return new THREE.WebGLRenderTarget(res, res, {
        minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
        format: THREE.RGBAFormat, type: SIM_TYPE,
        wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping
      });
    }

    var velocity, density, pressure, divergenceRT, curlRT;

    function initBuffers(res){
      velocity = makeDouble(res);
      density  = makeDouble(res);
      pressure = makeDouble(res);
      divergenceRT = makeSingle(res);
      curlRT = makeSingle(res);
      [velocity.read,velocity.write,density.read,density.write,pressure.read,pressure.write,divergenceRT,curlRT].forEach(function(rt){
        rt.texture.generateMipmaps = false;
        rt.texture.anisotropy = maxAniso;
      });
    }
    initBuffers(SIM_RES);
    var simTexel = new THREE.Vector2(1.0/SIM_RES, 1.0/SIM_RES);

    // ---- parameters ----
    var SPLAT_RADIUS = 0.00022;
    var SPLAT_FORCE = 6000;
    var DENSITY_DISSIPATION = 0.16;   // slow ink spread
    var VELOCITY_DISSIPATION = 0.28;  // flow settles
    var PRESSURE_DECAY = 0.8;
    var CURL = 22;

    // ---- render helpers ----
    function renderTarget(target){
      quadMesh.material = target;
      renderer.setRenderTarget(target);
      renderer.render(quadScene, quadCam);
      renderer.setRenderTarget(null);
    }
    function copyTexture(src, dst){
      copyProg.material.uniforms.uTexture.value = src;
      copyProg.material.uniforms.uScale.value = 1.0;
      renderTarget(copyProg.material);
    }
    function clearTexture(rt, val){
      clearProg.material.uniforms.uTexture.value = rt.texture;
      clearProg.material.uniforms.uValue.value = val;
      renderTarget(clearProg.material);
    }

    // ---- splat ----
    function splat(x, y, dx, dy, color){
      splatProg.material.uniforms.uTarget.value = velocity.read.texture;
      splatProg.material.uniforms.aspectRatio.value = SIM_RES / SIM_RES;
      splatProg.material.uniforms.point.value.set(x, y);
      splatProg.material.uniforms.color.value.set(dx, dy, 0.0);
      splatProg.material.uniforms.radius.value = SPLAT_RADIUS;
      renderTarget(splatProg.material);
      velocity.swap();

      splatProg.material.uniforms.uTarget.value = density.read.texture;
      splatProg.material.uniforms.color.value.set(color.x, color.y, color.z);
      renderTarget(splatProg.material);
      density.swap();
    }

    // ---- simulation step ----
    function step(dt){
      // curl
      curlProg.material.uniforms.uVelocity.value = velocity.read.texture;
      curlProg.material.uniforms.texelSize.value = simTexel;
      renderTarget(curlProg.material);

      // vorticity confinement
      vorticityProg.material.uniforms.uVelocity.value = velocity.read.texture;
      vorticityProg.material.uniforms.uCurl.value = curlRT.texture;
      vorticityProg.material.uniforms.texelSize.value = simTexel;
      vorticityProg.material.uniforms.curl.value = CURL;
      vorticityProg.material.uniforms.dt.value = dt;
      renderTarget(vorticityProg.material);
      velocity.swap();

      // divergence
      divergenceProg.material.uniforms.uVelocity.value = velocity.read.texture;
      divergenceProg.material.uniforms.texelSize.value = simTexel;
      renderTarget(divergenceProg.material);

      // decay pressure
      clearProg.material.uniforms.uTexture.value = pressure.read.texture;
      clearProg.material.uniforms.uValue.value = PRESSURE_DECAY;
      renderTarget(clearProg.material);
      pressure.swap();

      // jacobi pressure solve
      pressureProg.material.uniforms.uDivergence.value = divergenceRT.texture;
      pressureProg.material.uniforms.texelSize.value = simTexel;
      for(var i=0;i<PRESSURE_ITERATIONS;i++){
        pressureProg.material.uniforms.uPressure.value = pressure.read.texture;
        renderTarget(pressureProg.material);
        pressure.swap();
      }

      // gradient subtract (projection)
      gradientProg.material.uniforms.uPressure.value = pressure.read.texture;
      gradientProg.material.uniforms.uVelocity.value = velocity.read.texture;
      gradientProg.material.uniforms.texelSize.value = simTexel;
      renderTarget(gradientProg.material);
      velocity.swap();

      // advect velocity
      advectProg.material.uniforms.uVelocity.value = velocity.read.texture;
      advectProg.material.uniforms.uSource.value = velocity.read.texture;
      advectProg.material.uniforms.texelSize.value = simTexel;
      advectProg.material.uniforms.dt.value = dt;
      advectProg.material.uniforms.dissipation.value = VELOCITY_DISSIPATION;
      renderTarget(advectProg.material);
      velocity.swap();

      // advect density
      advectProg.material.uniforms.uVelocity.value = velocity.read.texture;
      advectProg.material.uniforms.uSource.value = density.read.texture;
      advectProg.material.uniforms.dissipation.value = DENSITY_DISSIPATION;
      renderTarget(advectProg.material);
      density.swap();
    }

    // ---- input ----
    var pointers = {};
    var pointersActive = 0;
    var hint = document.getElementById('hint');
    var hintHidden = false;

    function hideHint(){
      if(!hintHidden){ hintHidden = true; hint.classList.add('hide'); }
    }

    function addPointer(id){
      pointers[id] = { x:0, y:0, dx:0, dy:0, down:false, moved:false };
    }
    function getPointer(id){ return pointers[id]; }

    function onDown(id, x, y){
      addPointer(id);
      var p = getPointer(id);
      p.x = x; p.y = y; p.dx = 0; p.dy = 0; p.down = true; p.moved = false;
      pointersActive++;
      hideHint();
    }
    function onMove(id, x, y){
      var p = getPointer(id);
      if(!p) return;
      p.dx = x - p.x;
      p.dy = y - p.y;
      p.x = x; p.y = y;
      if(Math.abs(p.dx) > 0.0001 || Math.abs(p.dy) > 0.0001) p.moved = true;
    }
    function onUp(id){
      if(pointers[id]){ delete pointers[id]; pointersActive = Math.max(0, pointersActive-1); }
    }

    canvas.addEventListener('mousedown', function(e){
      onDown(-1, e.clientX/window.innerWidth, 1 - e.clientY/window.innerHeight);
    });
    window.addEventListener('mousemove', function(e){
      onMove(-1, e.clientX/window.innerWidth, 1 - e.clientY/window.innerHeight);
    });
    window.addEventListener('mouseup', function(){ onUp(-1); });

    canvas.addEventListener('touchstart', function(e){
      for(var i=0;i<e.changedTouches.length;i++){
        var t = e.changedTouches[i];
        onDown(t.identifier, t.clientX/window.innerWidth, 1 - t.clientY/window.innerHeight);
      }
      e.preventDefault();
    }, {passive:false});
    window.addEventListener('touchmove', function(e){
      for(var i=0;i<e.changedTouches.length;i++){
        var t = e.changedTouches[i];
        onMove(t.identifier, t.clientX/window.innerWidth, 1 - t.clientY/window.innerHeight);
      }
      e.preventDefault();
    }, {passive:false});
    window.addEventListener('touchend', function(e){
      for(var i=0;i<e.changedTouches.length;i++){ onUp(e.changedTouches[i].identifier); }
    });
    window.addEventListener('touchcancel', function(e){
      for(var i=0;i<e.changedTouches.length;i++){ onUp(e.changedTouches[i].identifier); }
    });

    function applyInput(){
      for(var id in pointers){
        var p = pointers[id];
        if(p.down && p.moved){
          var dx = p.dx * SPLAT_FORCE;
          var dy = p.dy * SPLAT_FORCE;
          var color = new THREE.Vector3(0.00035, 0.00035, 0.00035);
          splat(p.x, p.y, dx, dy, color);
          p.moved = false;
        }
      }
    }

    // ---- ambient life: faint turbulence + occasional drift ----
    function hash(n){ return (Math.sin(n) * 43758.5453123) % 1; }
    function rand(){ return Math.abs(hash(Math.random()*10000 + performance.now())); }

    function seedAmbient(){
      // very faint velocity turbulence so the water feels alive
      for(var i=0;i<10;i++){
        var a = Math.random()*Math.PI*2;
        var m = 2.5 + Math.random()*4.0;
        splat(Math.random(), Math.random(), Math.cos(a)*m, Math.sin(a)*m,
              new THREE.Vector3(0.000004,0.000004,0.000004));
      }
    }

    var lastDrift = 0;
    function ambientDrift(now){
      if(now - lastDrift > 2600){
        lastDrift = now;
        var a = Math.random()*Math.PI*2;
        var m = 3.0 + Math.random()*3.5;
        splat(Math.random(), Math.random(), Math.cos(a)*m, Math.sin(a)*m,
              new THREE.Vector3(0.000006,0.000006,0.000006));
      }
    }

    // ---- resize ----
    function resize(){
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      // clear simulation buffers (no NaNs, fresh state)
      [velocity.read,velocity.write,density.read,density.write,pressure.read,pressure.write].forEach(function(rt){
        clearTexture(rt, 0.0);
      });
      seedAmbient();
    }
    window.addEventListener('resize', resize);

    // ---- stats ----
    var sFps = document.getElementById('s-fps');
    var sGrid = document.getElementById('s-grid');
    var sSolver = document.getElementById('s-solver');
    sGrid.textContent = SIM_RES + '²';
    sSolver.textContent = solverLabel;

    var frames = 0, statTime = performance.now();

    // ---- loop ----
    var last = performance.now();
    function loop(now){
      requestAnimationFrame(loop);

      var dt = (now - last) / 1000.0;
      last = now;
      if(dt > 0.033) dt = 0.033;   // clamp for stability
      if(dt <= 0) dt = 0.001;

      applyInput();
      ambientDrift(now);
      step(dt);

      // display
      displayProg.material.uniforms.uDensity.value = density.read.texture;
      renderTarget(displayProg.material);

      frames++;
      if(now - statTime >= 500){
        var fps = Math.round((frames * 1000) / (now - statTime));
        sFps.textContent = fps;
        frames = 0;
        statTime = now;
      }
    }

    // ---- boot ----
    resize();
    seedAmbient();
    requestAnimationFrame(loop);

  })();
  </script>
</body>
</html>
