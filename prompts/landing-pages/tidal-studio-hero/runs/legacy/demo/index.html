<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tidal</title>
<style>
  :root{--ink:#e8f1ef;--bg1:#0b1c24;--bg2:#163a45;--accent:#7ec8c3}
  *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Georgia,serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink)}
  main{min-height:100vh;display:grid;align-content:center;padding:6vw;background:radial-gradient(ellipse at 70% 40%,rgba(126,200,195,.18),transparent 55%)}
  .brand{font-size:clamp(3rem,8vw,6rem);margin:0;letter-spacing:-.03em}
  p{max-width:28rem;opacity:.85;font-size:1.1rem}
  a{color:var(--bg1);background:var(--accent);padding:.85rem 1.3rem;text-decoration:none;display:inline-block;margin-top:1rem}
</style></head>
<body><main>
  <p style="letter-spacing:.2em;text-transform:uppercase;font-family:monospace;font-size:.8rem;color:var(--accent)">Studio</p>
  <h1 class="brand">Tidal</h1>
  <p>Coastal brand systems with quiet precision.</p>
  <a href="#">Book a call</a>
</main></body></html>
