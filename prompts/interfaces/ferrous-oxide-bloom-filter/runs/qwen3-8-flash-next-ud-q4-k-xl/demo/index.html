<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdigris OS — Oxidative Data Excavation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1b1a;
    --copper:#8b5a2b;
    --copper-hi:#b07c46;
    --oxide-d:#2e4a46;
    --oxide-l:#7ab8a0;
    --ink:#e6f0eb;
    --error:#d9534f;
    --chrome:#1a2b29;
    --hair:rgba(122,184,160,0.16);
    --hair-strong:rgba(122,184,160,0.32);
    --mono:'Space Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --topbar:60px;
    --timeline:88px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- TOP BAR ---------- */
  .topbar{
    height:var(--topbar);
    flex:0 0 auto;
    display:flex;align-items:center;gap:24px;
    padding:0 22px;
    border-bottom:1px solid var(--hair-strong);
    background:linear-gradient(180deg,#122522,#0f1e1c);
    position:relative;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .brand .mark{
    font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:1px;
    color:var(--oxide-l);border:1px solid var(--hair-strong);
    padding:6px 8px;border-radius:2px;line-height:1;
    background:radial-gradient(circle at 30% 25%,rgba(122,184,160,.22),transparent 70%);
  }
  .brand .word{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:1px}
  .brand .word em{font-style:normal;color:var(--oxide-l)}
  .brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:rgba(230,240,235,.42);text-transform:uppercase}

  .status{display:flex;align-items:center;gap:22px;margin-left:8px;flex:1 1 auto;min-width:0;overflow:hidden}
  .status .grp{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .status .k{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(230,240,235,.4)}
  .status .v{font-family:var(--mono);font-size:13px;color:var(--ink)}
  .status .v.acc{color:var(--oxide-l)}
  .sep{width:1px;height:26px;background:var(--hair)}

  .controls{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .btn{
    font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink);background:transparent;border:1px solid var(--hair-strong);
    padding:8px 12px;border-radius:2px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;
  }
  .btn:hover{background:rgba(122,184,160,.12);border-color:var(--oxide-l)}
  .btn.on{background:var(--oxide-l);color:#0b1614;border-color:var(--oxide-l)}
  .btn.ghost{border-color:transparent;color:rgba(230,240,235,.5)}
  .btn.ghost:hover{color:var(--ink)}
  .btn:focus-visible,.scrub:focus-visible{outline:2px solid var(--oxide-l);outline-offset:2px}

  /* ---------- MAIN ---------- */
  .main{flex:1 1 auto;display:flex;min-height:0;position:relative}
  .canvas-wrap{flex:1 1 auto;position:relative;min-width:0;background:var(--bg)}
  #plate{display:block;width:100%;height:100%;cursor:none}
  .app.hc #plate{cursor:crosshair}
  .app.hc #plate.empty{cursor:not-allowed}

  .axis{position:absolute;left:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px 0;pointer-events:none;z-index:4}
  .axis span{font-family:var(--mono);font-size:10px;color:rgba(230,240,235,.34);letter-spacing:.5px}

  .empty-flag{
    position:absolute;top:16px;left:16px;z-index:6;display:none;
    font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--oxide-l);border:1px solid var(--hair-strong);padding:6px 10px;border-radius:2px;
    background:rgba(13,27,26,.6);
  }
  .empty-flag.show{display:block}

  .cursor{
    position:absolute;top:0;left:0;width:150px;height:150px;border-radius:50%;
    border:1px solid rgba(122,184,160,.5);pointer-events:none;z-index:8;
    transform:translate(-50%,-50%) scale(0);transition:transform .14s ease-out,opacity .2s;
    mix-blend-mode:screen;opacity:0;
  }
  .cursor::after{content:'';position:absolute;inset:44%;border:1px solid rgba(230,240,235,.35);border-radius:50%}
  .cursor.active{opacity:.85}
  .cursor.dead{border-color:var(--error);opacity:.7}
  .cursor.dead::before{content:'NO DATA';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--error)}
  .app.hc .cursor{display:none}

  /* ---------- SIDE PANEL ---------- */
  .panel{
    width:330px;flex:0 0 330px;
    background:var(--chrome);
    border-left:1px solid var(--hair-strong);
    transform:translateX(100%);
    transition:transform .5s cubic-bezier(0.2,0.8,0.2,1);
    display:flex;flex-direction:column;overflow-y:auto;z-index:15;
  }
  .panel.open{transform:translateX(0)}
  .panel .phead{padding:18px 20px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .panel .phead h2{font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.2}
  .panel .phead .id{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--oxide-l);text-transform:uppercase;margin-bottom:5px}
  .panel .close{font-family:var(--mono);font-size:16px;color:rgba(230,240,235,.5);background:none;border:none;cursor:pointer;line-height:1;padding:2px}
  .panel .close:hover{color:var(--ink)}
  .panel .metric{padding:20px;border-bottom:1px solid var(--hair)}
  .panel .metric .lab{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(230,240,235,.4)}
  .panel .metric .big{font-family:var(--mono);font-weight:700;font-size:40px;line-height:1;margin-top:8px;color:var(--ink)}
  .panel .metric .big .u{font-size:16px;color:var(--oxide-l);margin-left:4px}
  .panel .metric .trend{font-family:var(--mono);font-size:11px;margin-top:8px;color:var(--oxide-l)}
  .panel .metric .trend.down{color:var(--oxide-d)}
  .panel .spark{width:100%;height:52px;display:block;margin-top:12px}
  .panel .rows{padding:6px 0}
  .panel .row{display:flex;justify-content:space-between;gap:12px;padding:11px 20px;border-bottom:1px solid var(--hair)}
  .panel .row .k{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(230,240,235,.45)}
  .panel .row .v{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right}
  .panel .note{padding:16px 20px;font-family:var(--sans);font-size:12px;line-height:1.55;color:rgba(230,240,235,.62)}

  /* ---------- TIMELINE ---------- */
  .timeline{
    height:var(--timeline);flex:0 0 auto;
    border-top:1px solid var(--hair-strong);
    background:linear-gradient(180deg,#0f1e1c,#0c1817);
    padding:14px 22px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:15;
  }
  .tl-top{display:flex;justify-content:space-between;align-items:baseline}
  .tl-top .lab{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(230,240,235,.4)}
  .tl-top .read{font-family:var(--mono);font-size:14px;color:var(--ink)}
  .tl-top .read .w{color:var(--oxide-l)}
  .scrub-wrap{position:relative;height:34px;display:flex;align-items:center}
  #scrub{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;background:transparent;cursor:ew-resize;
    position:relative;z-index:3;
  }
  #scrub::-webkit-slider-runnable-track{height:4px;background:transparent}
  #scrub::-moz-range-track{height:4px;background:transparent}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:34px;background:var(--oxide-l);border-radius:0;box-shadow:0 0 12px rgba(122,184,160,.7);margin-top:-15px}
  #scrub::-moz-range-thumb{width:2px;height:34px;background:var(--oxide-l);border:none;border-radius:0;box-shadow:0 0 12px rgba(122,184,160,.7)}
  .scrub-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:var(--oxide-d);border-radius:2px;overflow:hidden}
  .scrub-fill{height:100%;background:linear-gradient(90deg,var(--oxide-d),var(--oxide-l));width:0%}
  .ticks{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:34px;pointer-events:none;display:flex;justify-content:space-between}
  .ticks i{width:1px;background:var(--hair);height:10px;align-self:center}
  .ticks i.dead{background:rgba(217,83,79,.5)}

  /* ---------- TOAST ---------- */
  .toast{
    position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);
    font-family:var(--mono);font-size:11px;letter-spacing:1px;
    background:rgba(13,27,26,.92);border:1px solid var(--hair-strong);color:var(--ink);
    padding:10px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;
    max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .hint{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:rgba(230,240,235,.55);pointer-events:none;z-index:5;
    transition:opacity .6s;text-align:center;line-height:1.9;
  }
  .hint b{color:var(--oxide-l);font-weight:700}
  .hint.gone{opacity:0}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:860px){
    .brand .sub{display:none}
    .status{gap:14px}
    .status .grp:nth-child(n+4){display:none}
    .panel{position:absolute;top:0;right:0;bottom:0;width:min(340px,86%);box-shadow:-1px 0 0 var(--hair-strong)}
  }
  @media (max-width:560px){
    .brand .word{font-size:16px}
    .status .grp:nth-child(n+2){display:none}
    .btn{padding:7px 9px;font-size:9px}
    .topbar{gap:12px;padding:0 14px}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <span class="mark">V·OS</span>
      <div>
        <div class="word">VERDIGRIS<em>·</em>OS</div>
        <div class="sub">Oxidative Data Excavation</div>
      </div>
    </div>
    <div class="status">
      <div class="grp"><span class="k">Plate</span><span class="v" id="st-plate">CU-07 · Sector North</span></div>
      <div class="sep"></div>
      <div class="grp"><span class="k">Oxide</span><span class="v acc" id="st-oxide">—</span></div>
      <div class="sep"></div>
      <div class="grp"><span class="k">Stream</span><span class="v" id="st-stream">● LIVE</span></div>
      <div class="sep"></div>
      <div class="grp"><span class="k">Nodes</span><span class="v" id="st-nodes">—</span></div>
      <div class="sep"></div>
      <div class="grp"><span class="k">Render</span><span class="v" id="st-fps">60 fps</span></div>
    </div>
    <div class="controls">
      <button class="btn" id="btn-hc" aria-pressed="false">High Contrast</button>
      <button class="btn ghost" id="btn-pulse">Pulse Oxide</button>
      <button class="btn ghost" id="btn-fault">Inject Fault</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="canvas-wrap" id="wrap">
      <canvas id="plate"></canvas>
      <div class="axis" id="axis"></div>
      <div class="empty-flag" id="emptyFlag">Dead Zone · No data in range</div>
      <div class="cursor" id="cursor"></div>
      <div class="hint" id="hint"><b>Drag</b> across the plate to polish<br>the oxide and excavate the data beneath</div>
      <div class="toast" id="toast"></div>
    </div>

    <aside class="panel" id="panel" aria-hidden="true">
      <div class="phead">
        <div>
          <div class="id" id="p-id">NODE</div>
          <h2 id="p-name">Sensor</h2>
        </div>
        <button class="close" id="p-close" aria-label="Close detail panel">✕</button>
      </div>
      <div class="metric">
        <div class="lab" id="p-metric-label">Current Reading</div>
        <div class="big"><span id="p-value">0</span><span class="u" id="p-unit">ppm</span></div>
        <div class="trend" id="p-trend">—</div>
        <canvas class="spark" id="spark" width="290" height="52"></canvas>
      </div>
      <div class="rows" id="p-rows"></div>
      <div class="note" id="p-note"></div>
    </aside>
  </main>

  <!-- TIMELINE -->
  <footer class="timeline">
    <div class="tl-top">
      <span class="lab">Timeline · Wiper</span>
      <span class="read" id="tl-read">— <span class="w" id="tl-window"></span></span>
    </div>
    <div class="scrub-wrap">
      <div class="scrub-track"><div class="scrub-fill" id="scrub-fill"></div></div>
      <div class="ticks" id="ticks"></div>
      <input type="range" id="scrub" min="0" max="1000" value="1000" step="1" aria-label="Timeline scrubber">
    </div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- refs ----------
  var app=document.getElementById('app');
  var wrap=document.getElementById('wrap');
  var canvas=document.getElementById('plate');
  var ctx=canvas.getContext('2d');
  var cursorEl=document.getElementById('cursor');
  var hint=document.getElementById('hint');
  var toastEl=document.getElementById('toast');
  var emptyFlag=document.getElementById('emptyFlag');
  var panel=document.getElementById('panel');
  var scrub=document.getElementById('scrub');
  var scrubFill=document.getElementById('scrub-fill');
  var tlRead=document.getElementById('tl-read');
  var tlWindow=document.getElementById('tl-window');
  var ticksEl=document.getElementById('ticks');
  var axisEl=document.getElementById('axis');

  // ---------- palette ----------
  var COL={bg:'#0d1b1a',copper:'#8b5a2b',copperHi:'#b07c46',oxideD:'#2e4a46',oxideL:'#7ab8a0',ink:'#e6f0eb',error:'#d9534f'};

  // ---------- state ----------
  var W=0,H=0,DPR=1;
  var oxCv=document.createElement('canvas'), oxCtx=oxCv.getContext('2d');
  var clearCv=document.createElement('canvas'), clrCtx=clearCv.getContext('2d');
  var scratch=document.createElement('canvas'), sctx=scratch.getContext('2d');
  var noise=document.createElement('canvas'), nctx=noise.getContext('2d');

  var patches=[], nodes=[], series=[];
  var cursor={x:-9999,y:-9999,active:false,dead:false};
  var scrubbing=false, scrubX=0, scrubW=0;
  var highContrast=false, fault=false;
  var selected=null;
  var entranceT=0, entranceDone=false;
  var faultX=0, faultSeed=1;
  var time=0, last=performance.now();
  var fpsAcc=0, fpsFrames=0, fpsTimer=0;
  var hintShown=true;
  var hoverNode=null;
  var baseCoverage=0.85;

  // ---------- helpers ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function fmtDate(ms){var d=new Date(ms);return d.toISOString().slice(0,10);}
  function fmtTime(ms){var d=new Date(ms);return d.toISOString().slice(11,19);}
  function pad2(n){return (n<10?'0':'')+n;}

  // ---------- noise texture ----------
  function buildNoise(){
    var s=200; noise.width=s; noise.height=s;
    var img=nctx.createImageData(s,s);
    for(var i=0;i<s*s;i++){
      var v=Math.random()*255|0;
      img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255;
    }
    nctx.putImageData(img,0,0);
  }

  // ---------- data ----------
  var DEAD_START=0.50, DEAD_END=0.62;
  function hasData(t){ return !(t>=DEAD_START && t<=DEAD_END); }

  function buildData(){
    nodes=[]; series=[];
    var defs=[
      {name:'Airborne Particulate',unit:'µg/m³',base:34,amp:22,phase:0.3,vol:0.10},
      {name:'Soil Moisture',unit:'%',base:41,amp:14,phase:1.7,vol:0.06},
      {name:'Groundwater pH',unit:'pH',base:6.9,amp:0.9,phase:2.6,vol:0.04},
      {name:'Ambient Temperature',unit:'°C',base:18.4,amp:7,phase:0.9,vol:0.12},
      {name:'Dissolved Oxygen',unit:'mg/L',base:8.2,amp:2.6,phase:3.4,vol:0.08}
    ];
    for(var i=0;i<defs.length;i++){
      var d=defs[i], pts=[], N=150, r=mulberry32(1000+i*97);
      for(var j=0;j<N;j++){
        var t=j/(N-1);
        var val=d.base + d.amp*Math.sin(t*Math.PI*2.4+d.phase) + d.amp*0.4*Math.sin(t*Math.PI*6.1+d.phase*1.3) + (r()-0.5)*d.amp*d.vol*3;
        pts.push({t:t,v:val});
      }
      series.push({def:d,pts:pts});
      // sample a node at a mid time
      var st=0.15+0.7*(i/(defs.length-1));
      var sv=sampleAt(pts,st);
      nodes.push({
        id:'ND-'+pad2(i+1), name:d.name, unit:d.unit, t:st, value:sv,
        x:0,y:0, sx:0, sy:0, r:5.5, spark:pts,
        note:noteFor(i,d)
      });
    }
  }
  function sampleAt(pts,t){
    t=clamp(t,0,1);
    var f=t*(pts.length-1), i=Math.floor(f), fr=f-i;
    if(i>=pts.length-1) return pts[pts.length-1].v;
    return lerp(pts[i].v,pts[i+1].v,fr);
  }
  function noteFor(i,d){
    var notes=[
      'Continuous particulate load sampled at 4 Hz. Elevated readings cluster with seasonal inversion events.',
      'Capacitance probe at 30 cm depth. Moisture lags precipitation by roughly six hours.',
      'Electrochemical probe, weekly calibration. Values drift toward baseline after rainfall flush.',
      'Shielded thermistor. Diurnal swing dominates; long-term trend within tolerance.',
      'Optical DO sensor. Hypoxia risk threshold set at 5.0 mg/L — currently nominal.'
    ];
    return notes[i];
  }

  // ---------- oxide patches ----------
  function buildPatches(){
    patches=[];
    var count=500, r=mulberry32(4242);
    for(var i=0;i<count;i++){
      var t=r();
      patches.push({
        x:r(), y:r(),
        base: 14 + r()*34,
        t: t,
        phase: r()*Math.PI*2,
        hue: 0.35 + r()*0.65, // 0..1 blend oxideD->oxideL
        alpha: 0.55 + r()*0.4
      });
    }
  }
  function oxideColor(hue,alpha){
    // blend oxideD (#2e4a46) -> oxideL (#7ab8a0)
    var d=[46,74,70], l=[122,184,160];
    var c=[
      Math.round(lerp(d[0],l[0],hue)),
      Math.round(lerp(d[1],l[1],hue)),
      Math.round(lerp(d[2],l[2],hue))
    ];
    return 'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha+')';
  }

  // ---------- layout ----------
  function layout(){
    var rect=wrap.getBoundingClientRect();
    W=Math.max(1,rect.width); H=Math.max(1,rect.height);
    DPR=Math.min(2,window.devicePixelRatio||1);
    canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    oxCv.width=W; oxCv.height=H;
    clearCv.width=W; clearCv.height=H;
    scratch.width=W; scratch.height=H;
    faultX=W*(0.34+Math.random()*0.3);
    faultSeed=Math.random()*1000;
    layoutNodes();
    buildAxis();
    buildTicks();
  }
  function layoutNodes(){
    var padX=W*0.12, padY=H*0.16;
    var usableW=W-padX*2, usableH=H-padY*2;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      n.sx=padX + n.t*usableW;
      n.sy=padY + usableH*(0.14 + 0.72*(i/(nodes.length-1)));
      n.x=n.sx; n.y=n.sy;
    }
  }
  function buildAxis(){
    axisEl.innerHTML='';
    var vals=[100,75,50,25,0];
    for(var i=0;i<vals.length;i++){
      var s=document.createElement('span'); s.textContent=vals[i]+'%';
      axisEl.appendChild(s);
    }
  }
  function buildTicks(){
    ticksEl.innerHTML='';
    for(var i=0;i<=24;i++){
      var t=i/24, dead=(t>=DEAD_START&&t<=DEAD_END);
      var el=document.createElement('i');
      if(dead) el.className='dead';
      ticksEl.appendChild(el);
    }
  }

  // ---------- drawing ----------
  function drawCopper(){
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,COL.copperHi); g.addColorStop(0.5,COL.copper); g.addColorStop(1,'#6f4522');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // brushed streaks
    ctx.save(); ctx.globalAlpha=0.06;
    for(var i=0;i<70;i++){
      ctx.strokeStyle=Math.random()>0.5?'#d8a86a':'#3d2512';
      ctx.lineWidth=Math.random()*1.2;
      var y=Math.random()*H;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y+(Math.random()*6-3)); ctx.stroke();
    }
    ctx.restore();
  }
  function drawOxide(){
    var e=entranceEase(entranceT);
    oxCtx.clearRect(0,0,W,H);
    oxCtx.fillStyle=COL.bg; oxCtx.fillRect(0,0,W,H);
    // organic bloom patches
    for(var i=0;i<patches.length;i++){
      var p=patches[i];
      var grow = entranceDone ? (0.5+0.5*Math.sin(time*0.0006+p.phase)) : e;
      var rad = p.base*(0.55+grow*0.9);
      var a = p.alpha*(0.5+grow*0.5)*Math.min(1,e*1.3);
      if(rad<0.5||a<0.02) continue;
      var rg=oxCtx.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,rad);
      rg.addColorStop(0,oxideColor(p.hue,a));
      rg.addColorStop(0.6,oxideColor(p.hue,a*0.5));
      rg.addColorStop(1,oxideColor(p.hue,0));
      oxCtx.fillStyle=rg;
      oxCtx.beginPath(); oxCtx.arc(p.x*W,p.y*H,rad,0,Math.PI*2); oxCtx.fill();
    }
    // noise grain
    oxCtx.save(); oxCtx.globalAlpha=0.10; oxCtx.globalCompositeOperation='overlay';
    oxCtx.drawImage(noise,0,0,W,H); oxCtx.restore();
  }
  function drawClear(){
    clrCtx.clearRect(0,0,W,H);
    clrCtx.globalCompositeOperation='source-over';
    // timeline wiper
    if(scrubbing){
      var g=clrCtx.createLinearGradient(scrubX-scrubW/2,0,scrubX+scrubW/2,0);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(0.5,'rgba(0,0,0,1)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      clrCtx.fillStyle=g; clrCtx.fillRect(scrubX-scrubW/2,0,scrubW,H);
    }
    // cursor polish
    if(cursor.active && !cursor.dead){
      var r=75;
      var rg=clrCtx.createRadialGradient(cursor.x,cursor.y,0,cursor.x,cursor.y,r);
      rg.addColorStop(0,'rgba(0,0,0,1)');
      rg.addColorStop(0.55,'rgba(0,0,0,0.85)');
      rg.addColorStop(1,'rgba(0,0,0,0)');
      clrCtx.fillStyle=rg; clrCtx.beginPath(); clrCtx.arc(cursor.x,cursor.y,r,0,Math.PI*2); clrCtx.fill();
    }
    // selected lock
    if(selected){
      var rr=58;
      var rg2=clrCtx.createRadialGradient(selected.x,selected.y,0,selected.x,selected.y,rr);
      rg2.addColorStop(0,'rgba(0,0,0,1)'); rg2.addColorStop(0.6,'rgba(0,0,0,0.9)'); rg2.addColorStop(1,'rgba(0,0,0,0)');
      clrCtx.fillStyle=rg2; clrCtx.beginPath(); clrCtx.arc(selected.x,selected.y,rr,0,Math.PI*2); clrCtx.fill();
    }
  }

  function drawDataLayer(){
    var padX=W*0.12, padY=H*0.16;
    var usableW=W-padX*2;
    // faint grid
    sctx.save();
    sctx.strokeStyle='rgba(230,240,235,0.10)'; sctx.lineWidth=1;
    for(var gy=0;gy<=4;gy++){
      var yy=padY+usableH?0:0; // placeholder
    }
    var usableH=H-padY*2;
    for(var gy2=0;gy2<=4;gy2++){
      var y=padY+usableH*(gy2/4);
      sctx.beginPath(); sctx.moveTo(padX,y); sctx.lineTo(W-padX,y); sctx.stroke();
    }
    // dead zone shading
    var dx0=padX+DEAD_START*usableW, dx1=padX+DEAD_END*usableW;
    sctx.fillStyle='rgba(217,83,79,0.06)'; sctx.fillRect(dx0,padY,dx1-dx0,usableH);
    sctx.strokeStyle='rgba(217,83,79,0.25)'; sctx.setLineDash([4,5]);
    sctx.beginPath(); sctx.moveTo(dx0,padY); sctx.lineTo(dx0,H-padY); sctx.moveTo(dx1,padY); sctx.lineTo(dx1,H-padY); sctx.stroke();
    sctx.setLineDash([]);
    sctx.restore();

    // series lines
    sctx.save();
    sctx.strokeStyle=COL.ink; sctx.lineWidth=1.4; sctx.lineJoin='round';
    for(var s=0;s<series.length;s++){
      var pts=series[s].pts;
      sctx.beginPath();
      for(var j=0;j<pts.length;j++){
        var px=padX+pts[j].t*usableW;
        var py=padY+usableH*(1-clamp((pts[j].v-series[s].def.base+series[s].def.amp)/(series[s].def.amp*2),0.05,0.95));
        if(j===0) sctx.moveTo(px,py); else sctx.lineTo(px,py);
      }
      sctx.globalAlpha=0.5; sctx.stroke();
    }
    sctx.restore();

    // nodes
    sctx.save();
    for(var n=0;n<nodes.length;n++){
      var nd=nodes[n];
      sctx.globalAlpha=1;
      sctx.fillStyle=COL.ink;
      sctx.beginPath(); sctx.arc(nd.x,nd.y,nd.r,0,Math.PI*2); sctx.fill();
      sctx.fillStyle=COL.bg;
      sctx.beginPath(); sctx.arc(nd.x,nd.y,nd.r-2.4,0,Math.PI*2); sctx.fill();
      sctx.fillStyle=COL.ink;
      sctx.beginPath(); sctx.arc(nd.x,nd.y,1.6,0,Math.PI*2); sctx.fill();
      if(nd===hoverNode||nd===selected){
        sctx.strokeStyle=COL.oxideL; sctx.lineWidth=1.4;
        sctx.beginPath(); sctx.arc(nd.x,nd.y,nd.r+5,0,Math.PI*2); sctx.stroke();
      }
    }
    sctx.restore();
  }

  function drawCrack(){
    if(!fault) return;
    ctx.save();
    ctx.strokeStyle=COL.error; ctx.lineWidth=2; ctx.shadowColor=COL.error; ctx.shadowBlur=8;
    ctx.beginPath();
    var y=H*0.12, x=faultX, r=mulberry32(Math.floor(faultSeed));
    ctx.moveTo(x,y);
    for(var i=0;i<14;i++){
      x+=(r()-0.5)*W*0.06; y+=H*0.055;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function entranceEase(t){ return t<0?0:t>1?1:t*t*(3-2*t); }

  // ---------- main loop ----------
  function frame(now){
    var dt=Math.min(50,now-last); last=now; time=now;

    // entrance
    if(!entranceDone){
      entranceT=reduce?1:entranceT+dt/5000;
      if(entranceT>=1){entranceT=1;entranceDone=true;}
    }

    // ambient patch drift
    if(!reduce && entranceDone){
      for(var i=0;i<patches.length;i++){
        var p=patches[i];
        p.x+=Math.cos(p.phase)*0.00004*dt; p.y+=Math.sin(p.phase*1.3)*0.00004*dt;
        if(p.x<0)p.x+=1; if(p.x>1)p.x-=1; if(p.y<0)p.y+=1; if(p.y>1)p.y-=1;
      }
    }

    // fps
    fpsAcc+=dt; fpsFrames++; fpsTimer+=dt;
    if(fpsTimer>=500){ var fps=Math.round(1000/(fpsAcc/fpsFrames)); document.getElementById('st-fps').textContent=fps+' fps'; fpsAcc=0;fpsFrames=0;fpsTimer=0; }

    // coverage estimate
    var cov=Math.round(baseCoverage*100);
    document.getElementById('st-oxide').textContent=cov+'%';

    if(highContrast){
      // HC mode: no oxide
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      drawDataLayer();
      ctx.save(); ctx.globalAlpha=1; ctx.drawImage(scratch,0,0,W,H); ctx.restore();
      drawCrack();
    } else {
      drawCopper();
      drawOxide();
      drawClear();
      drawDataLayer();
      // composite data through clear mask
      sctx.globalCompositeOperation='destination-in';
      sctx.drawImage(clearCv,0,0);
      sctx.globalCompositeOperation='source-over';
      ctx.drawImage(oxCv,0,0);
      ctx.drawImage(scratch,0,0);
      drawCrack();
    }

    requestAnimationFrame(frame);
  }

  // ---------- pointer ----------
  function localPos(e){
    var rect=canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left,y:e.clientY-rect.top};
  }
  function nodeAt(x,y){
    var best=null,bd=1e9;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], d=Math.hypot(n.x-x,n.y-y);
      if(d<bd){bd=d;best=n;}
    }
    return bd<18?best:null;
  }
  canvas.addEventListener('pointermove',function(e){
    var p=localPos(e);
    cursor.x=p.x; cursor.y=p.y; cursor.active=true;
    var dead=!hasData(p.x/W);
    cursor.dead=dead;
    emptyFlag.classList.toggle('show',dead);
    cursorEl.classList.toggle('dead',dead);
    cursorEl.style.transform='translate('+p.x+'px,'+p.y+'px) translate(-50%,-50%) scale(1)';
    cursorEl.classList.add('active');
    hoverNode=nodeAt(p.x,p.y);
    if(!scrubbing) scrub.value=Math.round((p.x/W)*1000);
    updateScrubUI();
    if(hintShown){ hint.classList.add('gone'); hintShown=false; }
  });
  canvas.addEventListener('pointerleave',function(){
    cursor.active=false; cursorEl.classList.remove('active'); emptyFlag.classList.remove('show');
    hoverNode=null;
  });
  canvas.addEventListener('pointerdown',function(e){
    var p=localPos(e);
    var n=nodeAt(p.x,p.y);
    if(n){ selectNode(n); }
    else if(!hasData(p.x/W)){ showToast('Dead zone — no data excavated in this range.'); }
    else { showToast('Polish to reveal — click a node to lock it open.'); }
  });

  // ---------- timeline ----------
  function updateScrubUI(){
    var v=scrub.value/1000;
    scrubFill.style.width=(v*100)+'%';
    var endMs=Date.now();
    var winMs=1000*60*60*24*30; // 30 day window
    var tMs=endMs-(1-v)*winMs;
    tlRead.innerHTML=fmtDate(tMs)+' <span class="w">'+fmtTime(tMs)+'</span>';
    tlWindow.textContent='± window · '+(hasData(v)?'live':'dead zone');
    scrubX=v*W; scrubW=W*0.22;
  }
  scrub.addEventListener('pointerdown',function(){scrubbing=true;});
  scrub.addEventListener('input',function(){scrubbing=true;updateScrubUI();});
  window.addEventListener('pointerup',function(){scrubbing=false;});

  // ---------- selection / panel ----------
  function selectNode(n){
    selected=n;
    document.getElementById('p-id').textContent=n.id+' · LOCKED';
    document.getElementById('p-name').textContent=n.name;
    var cur=sampleAt(n.spark,n.t);
    var prev=sampleAt(n.spark,clamp(n.t-0.06,0,1));
    var delta=cur-prev;
    document.getElementById('p-value').textContent=cur.toFixed(n.unit==='pH'?2:1);
    document.getElementById('p-unit').textContent=n.unit;
    var tr=document.getElementById('p-trend');
    tr.textContent=(delta>=0?'▲ +':'▼ ')+delta.toFixed(2)+' '+n.unit+' / 6h';
    tr.className='trend'+(delta<0?' down':'');
    // rows
    var rows=[
      ['Timestamp',fmtDate(Date.now())+' '+fmtTime(Date.now())],
      ['Confidence','98.4%'],
      ['Sampling','4 Hz continuous'],
      ['Oxide depth',(Math.round(baseCoverage*100))+'%'],
      ['Excavation','locked · suppressed'],
      ['Node status','nominal']
    ];
    var rh='';
    for(var i=0;i<rows.length;i++) rh+='<div class="row"><span class="k">'+rows[i][0]+'</span><span class="v">'+rows[i][1]+'</span></div>';
    document.getElementById('p-rows').innerHTML=rh;
    document.getElementById('p-note').textContent=n.note;
    panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
    drawSpark(n);
  }
  function drawSpark(n){
    var sc=document.getElementById('spark'), s2=sc.getContext('2d');
    var w=sc.width,h=sc.height; s2.clearRect(0,0,w,h);
    var pts=n.spark, base=n.unit==='pH'?6:0;
    var min=1e9,max=-1e9;
    for(var i=0;i<pts.length;i++){min=Math.min(min,pts[i].v);max=Math.max(max,pts[i].v);}
    s2.strokeStyle=COL.oxideL; s2.lineWidth=1.5; s2.beginPath();
    for(var j=0;j<pts.length;j++){
      var x=(j/(pts.length-1))*w, y=h-((pts[j].v-min)/(max-min||1))*(h-8)-4;
      if(j===0)s2.moveTo(x,y);else s2.lineTo(x,y);
    }
    s2.stroke();
    // current marker
    var cx=n.t*w, cy=h-((sampleAt(pts,n.t)-min)/(max-min||1))*(h-8)-4;
    s2.fillStyle=COL.ink; s2.beginPath(); s2.arc(cx,cy,3,0,Math.PI*2); s2.fill();
  }
  document.getElementById('p-close').addEventListener('click',function(){
    selected=null; panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
  });

  // ---------- controls ----------
  document.getElementById('btn-hc').addEventListener('click',function(){
    highContrast=!highContrast;
    this.classList.toggle('on',highContrast);
    this.setAttribute('aria-pressed',highContrast);
    app.classList.toggle('hc',highContrast);
    showToast(highContrast?'High contrast — oxide simulation disabled.':'Oxide simulation resumed.');
  });
  document.getElementById('btn-pulse').addEventListener('click',function(){
    // brief global clear then regrow
    var saved=baseCoverage; baseCoverage=0.25;
    showToast('Pulse — oxide suppressed, regrowing…');
    setTimeout(function(){baseCoverage=saved;},1400);
  });
  document.getElementById('btn-fault').addEventListener('click',function(){
    fault=!fault;
    var st=document.getElementById('st-stream');
    if(fault){ st.textContent='✕ LOST'; st.style.color=COL.error; showToast('Data stream lost — fault crack injected.'); }
    else { st.textContent='● LIVE'; st.style.color=''; showToast('Data stream restored.'); }
  });

  // ---------- toast ----------
  var toastTimer;
  function showToast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2200);
  }

  // ---------- init ----------
  buildNoise(); buildData(); buildPatches();
  function init(){
    layout();
    document.getElementById('st-nodes').textContent=nodes.length+' active';
    scrub.value=1000; updateScrubUI();
    if(reduce){ hint.classList.add('gone'); hintShown=false; }
    requestAnimationFrame(function(t){last=t;frame(t);});
  }
  var rt;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150);});
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(init);}else{window.addEventListener('load',init);}
})();
</script>
</body>
</html>
