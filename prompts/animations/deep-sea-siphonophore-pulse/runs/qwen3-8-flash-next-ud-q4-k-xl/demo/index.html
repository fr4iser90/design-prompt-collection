<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Sea Siphonophore Pulse</title>
<style>
  :root{
    --abyss:#020408;
    --deep:#051224;
    --cyan:#00f0ff;
    --green:#00ffcc;
    --snow:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    overflow:hidden;
    font-family:"Cormorant Garamond",Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:fixed;inset:0;
    display:block;
    background:#000;
  }
  .brand{
    position:fixed;left:50%;top:44%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#eafcff;
    z-index:5;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0;
    animation:reveal 2.6s ease-out .5s forwards;
  }
  .brand .kicker{
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:clamp(9px,1.1vw,12px);
    letter-spacing:.55em;
    text-transform:uppercase;
    color:rgba(0,240,255,.55);
    margin-bottom:.7rem;
    padding-left:.55em;
  }
  .brand h1{
    font-weight:300;
    font-size:clamp(38px,8.5vw,104px);
    line-height:.92;
    letter-spacing:.01em;
    color:#dffaff;
    text-shadow:0 0 40px rgba(0,240,255,.28),0 0 90px rgba(0,255,204,.12);
  }
  .brand h1 em{
    display:block;font-style:italic;font-weight:400;
    color:#8fe9ff;
  }
  .brand .meta{
    margin-top:1.1rem;
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:clamp(9px,1vw,11px);
    letter-spacing:.32em;
    color:rgba(180,235,255,.4);
    text-transform:uppercase;
  }
  @keyframes reveal{
    from{opacity:0;transform:translate(-50%,-46%)}
    to{opacity:.96;transform:translate(-50%,-50%)}
  }
  .vignette{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 52%,transparent 40%,rgba(0,0,0,.55) 100%);
  }
  @media (prefers-reduced-motion: reduce){
    .brand{animation:none;opacity:.96}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>
  <div class="brand">
    <div class="kicker">Abyssal Field Study · 4,200m</div>
    <h1>Siphonophore<em>Pulse</em></h1>
    <div class="meta">Bioluminescent Colonial Organism — Praya dubia</div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W=0,H=0,DPR=1,cx=0,cy=0,minDim=0;

  // ---- organic noise texture (grain) ----
  const noise = document.createElement('canvas');
  const nctx = noise.getContext('2d');
  const NS = 200;
  noise.width = noise.height = NS;
  const img = nctx.createImageData(NS,NS);
  for(let i=0;i<NS*NS;i++){
    const v = 200 + Math.random()*55;
    img.data[i*4] = v; img.data[i*4+1]=v; img.data[i*4+2]=v;
    img.data[i*4+3] = Math.random()<0.5?255:0;
  }
  nctx.putImageData(img,0,0);

  // ---- marine snow ----
  let snow = [];
  function buildSnow(){
    snow = [];
    const count = Math.round((W*H)/14000);
    for(let i=0;i<count;i++){
      snow.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.6+0.4,
        vy: (Math.random()*0.18+0.05),
        vx: (Math.random()-0.5)*0.05,
        ph: Math.random()*Math.PI*2,
        tw: Math.random()*0.6+0.2
      });
    }
  }

  // ---- tentacles ----
  const T = 15;
  const tentacles = [];
  for(let i=0;i<T;i++){
    const f = (i/(T-1))*2-1; // -1..1
    tentacles.push({
      f: f,
      len: (0.5 + Math.random()*0.45),
      base: f*0.42,
      sway: Math.random()*Math.PI*2,
      swaySpd: 0.25 + Math.random()*0.3,
      amp: 0.02 + Math.random()*0.05,
      w: 1.4 + Math.random()*2.2
    });
  }

  // ---- rings ----
  let rings = [];
  let lastPulse = 0;

  // ---- pointer ----
  let mx=0,my=0,pmx=0,pmy=0;
  window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; cy = H*0.5;
    minDim = Math.min(W,H);
    buildSnow();
  }
  window.addEventListener('resize',resize);
  resize();

  const PULSE = 7.2; // seconds, heavy & slow
  function easePulse(p){ // p 0..1 -> contraction factor 0..1
    // asymmetric: quick-ish contract, long slow relax
    const a = 0.42;
    if(p<a){ const t=p/a; return 1-Math.pow(t,1.6); } // 1->0
    const t=(p-a)/(1-a); return 0.15*(1-Math.cos(t*Math.PI))/2; // small secondary
  }

  function draw(now){
    const t = now/1000;
    // pointer smoothing
    pmx += (mx-pmx)*0.06; pmy += (my-pmy)*0.06;

    // ---- background: near-black radial ----
    const bg = ctx.createRadialGradient(cx,cy*0.9,minDim*0.05,cx,cy,Math.max(W,H)*0.75);
    bg.addColorStop(0,'#050a14');
    bg.addColorStop(0.55,'#030710');
    bg.addColorStop(1,'#020408');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // ---- pulse state ----
    const phase = (t % PULSE)/PULSE;
    let contraction = easePulse(phase);
    // defensive reflex near cursor
    const dpx = (pmx-cx)/W, dpy=(pmy-cy)/H;
    const dist = Math.hypot(dpx,dpy);
    const prox = Math.max(0, 1 - dist/0.5);
    contraction = Math.min(1, contraction + prox*0.18);
    const glowBoost = 1 + prox*0.5;

    const baseR = minDim*0.17;
    const R = baseR*(1 - contraction*0.30);   // bell radius
    const bellH = R*1.15;
    const topY = cy - bellH*0.5;

    // ---- emission intensity tied to pulse (brightest at contract) ----
    const emit = (0.55 + contraction*0.9) * glowBoost;

    // ---- ambient halo (refractive, not neon) ----
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(cx,cy,0,cx,cy,R*3.4);
    halo.addColorStop(0,`rgba(0,240,255,${0.10*emit})`);
    halo.addColorStop(0.35,`rgba(0,255,204,${0.05*emit})`);
    halo.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx,cy,R*3.4,0,Math.PI*2); ctx.fill();

    // ---- tentacles (behind bell) ----
    ctx.globalCompositeOperation = 'lighter';
    for(const tk of tentacles){
      const bx = cx + tk.base*R;
      const by = topY + bellH*0.82;
      const L = tk.len*minDim*0.55;
      ctx.beginPath();
      ctx.moveTo(bx,by);
      const segs = 22;
      let px=bx, py=by;
      for(let s=1;s<=segs;s++){
        const u = s/segs;
        const sway = Math.sin(t*tk.swaySpd + tk.sway + u*3.2) * tk.amp * (0.3+u);
        const drift = Math.sin(t*0.15 + tk.sway)*0.02;
        const nx = bx + (tk.f*0.18 + sway + drift)*L*u;
        const ny = by + u*L*(0.7+0.3*u);
        ctx.quadraticCurveTo(px,py,(px+nx)/2,(py+ny)/2);
        px=nx; py=ny;
      }
      ctx.strokeStyle = `rgba(120,230,255,${0.10*emit})`;
      ctx.lineWidth = tk.w*(1-contraction*0.3);
      ctx.stroke();
      // faint inner light line
      ctx.strokeStyle = `rgba(0,240,255,${0.05*emit})`;
      ctx.lineWidth = tk.w*0.4;
      ctx.stroke();
    }

    // ---- bell body (translucent, no hard outline) ----
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.beginPath();
    // dome top + flared skirt
    ctx.moveTo(cx-R, topY+bellH*0.55);
    ctx.bezierCurveTo(cx-R, topY-bellH*0.35, cx+R, topY-bellH*0.35, cx+R, topY+bellH*0.55);
    // skirt with gentle scallops
    const scal = 6;
    for(let i=0;i<scal;i++){
      const x0 = cx+R - (2*R)*(i/scal);
      const x1 = cx+R - (2*R)*((i+1)/scal);
      const dip = topY+bellH*0.72 + Math.sin(t*0.4+i)*R*0.02;
      ctx.quadraticCurveTo((x0+x1)/2, dip, x1, topY+bellH*0.55 + Math.sin(t*0.4+i)*R*0.01);
    }
    ctx.closePath();
    ctx.clip();

    // bell fill gradient (light from within)
    const bell = ctx.createRadialGradient(cx, cy+bellH*0.1, R*0.1, cx, cy, R*1.25);
    bell.addColorStop(0,`rgba(180,255,250,${0.30*emit})`);
    bell.addColorStop(0.4,`rgba(0,240,255,${0.16*emit})`);
    bell.addColorStop(0.75,`rgba(0,120,180,${0.10*emit})`);
    bell.addColorStop(1,'rgba(0,40,70,0.02)');
    ctx.fillStyle = bell;
    ctx.fillRect(cx-R*1.5, topY-bellH, R*3, bellH*2.4);

    // caustic light streaks inside
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<4;i++){
      const a = t*0.3 + i*1.7;
      const gx = cx + Math.cos(a)*R*0.4;
      const gy = cy + Math.sin(a*0.8)*bellH*0.3;
      const cg = ctx.createRadialGradient(gx,gy,0,gx,gy,R*0.5);
      cg.addColorStop(0,`rgba(0,255,204,${0.10*emit})`);
      cg.addColorStop(1,'rgba(0,255,204,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(cx-R*1.5,topY-bellH,R*3,bellH*2.4);
    }

    // organic noise texture over bell
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.10;
    for(let i=0;i<3;i++){
      const ox = Math.sin(t*0.2+i)*20, oy = Math.cos(t*0.17+i)*20;
      ctx.drawImage(noise, cx-R*1.4+ox, topY-bellH*0.6+oy, R*2.8, bellH*2.2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // ---- bioluminescent core ----
    ctx.globalCompositeOperation = 'lighter';
    const core = ctx.createRadialGradient(cx,cy+bellH*0.05,0,cx,cy+bellH*0.05,R*0.9);
    core.addColorStop(0,`rgba(220,255,255,${0.55*emit})`);
    core.addColorStop(0.3,`rgba(0,240,255,${0.30*emit})`);
    core.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(cx,cy+bellH*0.05,R*0.9,0,Math.PI*2); ctx.fill();

    // ---- released rings (dissipating) ----
    if(!reduce){
      if(t - lastPulse > PULSE*0.98){ lastPulse = t; }
      if(phase < 0.02 && rings.length<4 && t-lastPulse>0.05){
        rings.push({r:R*0.4, a:0.5});
        lastPulse = t;
      }
    } else {
      rings = [{r:R*0.9,a:0.35}];
    }
    for(const rg of rings){
      rg.r += (reduce?0:0.9);
      rg.a -= 0.006;
      ctx.strokeStyle = `rgba(0,240,255,${Math.max(0,rg.a)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(cx,cy+bellH*0.1,rg.r,rg.r*0.7,0,0,Math.PI*2); ctx.stroke();
    }
    rings = rings.filter(r=>r.a>0);

    // ---- marine snow (through bell, catching light) ----
    ctx.globalCompositeOperation = 'lighter';
    for(const p of snow){
      if(!reduce){
        p.y -= p.vy; p.x += p.vx + Math.sin(t*0.3+p.ph)*0.05;
        if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
        if(p.x<-5)p.x=W+5; if(p.x>W+5)p.x=-5;
      }
      const d = Math.hypot(p.x-cx,p.y-cy);
      const lit = Math.max(0, 1 - d/(R*2.6));
      const tw = 0.4 + 0.6*Math.sin(t*p.tw*2 + p.ph);
      const a = (0.05 + lit*0.5) * tw;
      const col = lit>0.25 ? `rgba(180,255,250,${a})` : `rgba(255,255,255,${a*0.7})`;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      if(lit>0.4){
        ctx.fillStyle = `rgba(0,240,255,${a*0.4})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.4,0,Math.PI*2); ctx.fill();
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
