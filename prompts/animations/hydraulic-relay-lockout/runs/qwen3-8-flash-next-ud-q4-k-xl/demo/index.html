<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYDRAULIC RELAY LOCKOUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#1A1A1A;
    --void-2:#141414;
    --void-3:#0e0e0e;
    --red:#D90429;
    --red-lit:#FF2749;
    --red-deep:#8f0419;
    --red-dark:#5c0210;
    --silver:#B0B0B0;
    --silver-hi:#E0E0E0;
    --silver-mid:#9a9a9a;
    --silver-lo:#5a5a5a;
    --amber:#FFB703;
    --amber-dim:#8a6410;
    --green:#06D6A0;
    --green-dim:#0a5a48;
    --white:#F4F4F4;
    --mute:#7a7a7a;
    --line:rgba(255,255,255,.05);
    --font:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease-snap:cubic-bezier(.25,1,.5,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font);
    color:var(--white);
    background:
      radial-gradient(120% 90% at 50% 42%, #202020 0%, var(--void) 46%, var(--void-2) 78%, var(--void-3) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- BACKGROUND LAYERS ---------- */
  .layer{position:fixed;inset:0;pointer-events:none}
  .grid{
    z-index:1;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px;
    background-position:center;
    -webkit-mask-image:radial-gradient(115% 95% at 50% 46%,#000 34%,transparent 84%);
            mask-image:radial-gradient(115% 95% at 50% 46%,#000 34%,transparent 84%);
  }
  .grid-fine{
    z-index:1;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:9px 9px;
    background-position:center;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 46%,#000 0%,transparent 72%);
            mask-image:radial-gradient(70% 60% at 50% 46%,#000 0%,transparent 72%);
  }
  .scan{
    z-index:1;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    z-index:2;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,.7);
  }
  .hazard{
    z-index:3;
    height:12px;
    top:auto;
    bottom:0;
    background:repeating-linear-gradient(45deg,var(--red) 0 16px,#101010 16px 32px);
    opacity:.55;
    border-top:1px solid rgba(0,0,0,.5);
  }
  .hazard.top{bottom:auto;top:0;border-top:none;border-bottom:1px solid rgba(0,0,0,.5)}

  /* ---------- HUD FRAME ---------- */
  .hud{position:fixed;inset:0;z-index:6;pointer-events:none}
  .hud .tick{position:absolute;font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
  .hud .tl{top:22px;left:26px}
  .hud .tr{top:22px;right:26px;text-align:right}
  .hud .bl{bottom:26px;left:26px}
  .hud .br{bottom:26px;right:26px;text-align:right}
  .hud .tick b{color:var(--white);font-weight:600}
  .hud .tick .k{color:var(--red-lit)}
  .bracket{position:absolute;width:22px;height:22px;border:1px solid rgba(255,255,255,.18)}
  .bracket.a{top:14px;left:14px;border-right:none;border-bottom:none}
  .bracket.b{top:14px;right:14px;border-left:none;border-bottom:none}
  .bracket.c{bottom:14px;left:14px;border-right:none;border-top:none}
  .bracket.d{bottom:14px;right:14px;border-left:none;border-top:none}

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:5;
    width:min(1180px,94vw);
    display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.4vh,34px);
    padding:20px 0;
  }

  .brand{
    text-align:center;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:-.045em;
    line-height:.86;
    color:var(--white);
    font-size:clamp(2.05rem,6.6vw,5rem);
    display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 .32em;
  }
  .brand .w{position:relative;display:inline-block}
  .brand .w::after{
    content:"";position:absolute;left:0;right:0;bottom:-.06em;height:2px;background:var(--red);
    transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease-out);
  }
  body.engaged .brand .w::after{transform:scaleX(1)}
  .brand .w:nth-child(2)::after{transition-delay:.08s}
  .brand .w:nth-child(3)::after{transition-delay:.16s}
  .brand .lock{color:var(--red-lit)}

  .subline{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);
  }
  .subline .sep{width:40px;height:1px;background:rgba(255,255,255,.16)}
  .subline .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  body.engaged .subline .dot{background:var(--green);box-shadow:0 0 10px var(--green)}

  /* ---------- MECHANISM ---------- */
  .mech{
    position:relative;
    width:min(760px,90vw);
    height:clamp(200px,34vh,286px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .mech:focus-visible{outline:2px solid var(--red-lit);outline-offset:14px}

  .led{
    position:absolute;top:2px;left:50%;transform:translateX(-50%);
    width:18px;height:18px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 4px #0c0c0c, 0 0 0 6px rgba(255,255,255,.06), 0 0 14px 2px var(--amber);
    transition:background .1s linear,box-shadow .1s linear;
    animation:ledPulse 2.4s ease-in-out infinite;
    z-index:8;
  }
  body.engaged .led{
    background:var(--green);
    box-shadow:0 0 0 4px #0c0c0c, 0 0 0 6px rgba(255,255,255,.08), 0 0 22px 4px var(--green);
    animation:none;
  }
  @keyframes ledPulse{0%,100%{opacity:.55}50%{opacity:1}}

  .assembly{
    position:relative;
    width:100%;height:150px;
    transform:scale(var(--s,1));
    transform-origin:center;
  }

  /* fixed parts */
  .frame{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none}

  .actuator{
    position:absolute;top:44px;height:62px;right:0;width:38%;
    background:#2b2b2b;border:1px solid #3a3a3a;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.05), inset 0 -4px 0 rgba(0,0,0,.5);
  }
  .actuator::before{
    content:"";position:absolute;top:14px;bottom:14px;right:12px;width:8px;background:#1c1c1c;
    box-shadow:14px 0 0 #1c1c1c,28px 0 0 #1c1c1c;
  }
  .actuator .cap{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:14px;height:80px;background:#333;border:1px solid #444;
  }

  .shaft{
    position:absolute;top:66px;height:18px;left:52%;right:0;
    background:#3a3a3a;border-top:1px solid #4a4a4a;border-bottom:1px solid #222;
  }

  .housing{
    position:absolute;top:26px;height:98px;left:26px;width:280px;
    background:var(--red);
    border:1px solid #ff4d63;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.14), inset 0 -6px 0 rgba(0,0,0,.42), inset 6px 0 0 rgba(0,0,0,.16);
  }
  .housing::before{ /* bolt row */
    content:"";position:absolute;left:10px;right:10px;top:8px;height:6px;
    background:repeating-linear-gradient(90deg,#5c0210 0 4px,transparent 4px 26px);
  }
  .housing::after{ /* bolt row bottom */
    content:"";position:absolute;left:10px;right:10px;bottom:8px;height:6px;
    background:repeating-linear-gradient(90deg,#5c0210 0 4px,transparent 4px 26px);
  }
  .mouth{
    position:absolute;top:50%;right:0;transform:translateY(-50%);
    width:34px;height:46px;background:var(--void-3);
    border-left:2px solid var(--red-dark);
    box-shadow:inset 6px 0 0 rgba(0,0,0,.6);
  }
  .mouth .lip{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red-lit)}

  .mount{
    position:absolute;top:124px;left:26px;width:280px;height:16px;background:#262626;
    border:1px solid #333;border-top:none;
  }
  .mount::before,.mount::after{content:"";position:absolute;top:4px;width:8px;height:8px;border-radius:50%;background:#111}
  .mount::before{left:14px}.mount::after{right:14px}

  /* moving pin */
  .pin{
    position:absolute;top:50%;
    width:238px;height:44px;
    transform:translate3d(0,0,0);
    transform-origin:right center;
    transition:transform .66s var(--ease-snap);
    will-change:transform;
    z-index:4;
  }
  .pin-inner{
    position:relative;width:100%;height:100%;
    background:var(--silver);
    border:1px solid var(--silver-hi);
    box-shadow:inset 0 4px 0 var(--silver-hi), inset 0 -5px 0 var(--silver-lo);
    transition:transform .09s ease;
    transform-origin:right center;
  }
  .pin-inner::before{ /* collar */
    content:"";position:absolute;right:0;top:-8px;bottom:-8px;width:16px;
    background:var(--silver-mid);border:1px solid var(--silver-hi);
    box-shadow:inset 0 3px 0 var(--silver-hi),inset 0 -3px 0 var(--silver-lo);
  }
  .pin-inner::after{ /* lead chamfer */
    content:"";position:absolute;left:-1px;top:0;bottom:0;width:14px;
    background:var(--silver);
    clip-path:polygon(100% 0,100% 100%,0 50%);
  }
  .pin .grooves{
    position:absolute;left:34px;right:24px;top:10px;bottom:10px;
    background:repeating-linear-gradient(90deg,var(--silver-lo) 0 3px,transparent 3px 16px);
    opacity:.5;
  }
  .pin .tag{
    position:absolute;left:44px;top:50%;transform:translateY(-50%);
    font-size:10px;font-weight:600;letter-spacing:.18em;color:#3a3a3a;
  }

  /* idle ambient vibration (live voltage) */
  body:not(.engaged):not(.releasing) .pin-inner{animation:hum 1.1s steps(2) infinite}
  @keyframes hum{0%{transform:translateY(0)}50%{transform:translateY(-.5px)}100%{transform:translateY(0)}}

  /* engaged snap: squash + settle */
  body.engaged .pin{
    transform:translate3d(-140px,0,0);
    animation:snap 1.1s var(--ease-out) forwards;
  }
  body.engaged .pin-inner{animation:none}
  @keyframes snap{
    0%{transform:translate3d(-140px,0,0)}
    10%{transform:translate3d(-146px,0,0)}
    22%{transform:translate3d(-138px,0,0)}
    40%{transform:translate3d(-141px,0,0)}
    62%{transform:translate3d(-139.5px,0,0)}
    100%{transform:translate3d(-140px,0,0)}
  }
  body.engaged .pin-inner{animation:squash .32s ease .52s forwards}
  @keyframes squash{
    0%{transform:scaleX(1)}
    35%{transform:scaleX(.96)}
    100%{transform:scaleX(1)}
  }

  /* releasing */
  body.releasing .pin{transform:translate3d(0,0,0);transition:transform .8s var(--ease-out)}
  body.releasing .pin-inner{animation:none}

  /* impact flash + shake */
  .flash{
    position:absolute;top:50%;left:300px;width:60px;height:60px;transform:translate(-50%,-50%) scale(.4);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,39,73,.4) 40%,transparent 70%);
    opacity:0;pointer-events:none;z-index:7;
  }
  body.engaged .flash{animation:flash .5s ease .5s forwards}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
  body.engaged .assembly{animation:shake .34s ease .5s}
  @keyframes shake{
    0%,100%{transform:scale(var(--s,1)) translate(0,0)}
    25%{transform:scale(var(--s,1)) translate(-2px,1px)}
    50%{transform:scale(var(--s,1)) translate(2px,-1px)}
    75%{transform:scale(var(--s,1)) translate(-1px,1px)}
  }

  /* ---------- READOUT ---------- */
  .readout{
    display:flex;align-items:stretch;gap:18px;flex-wrap:wrap;justify-content:center;
    width:min(760px,92vw);
  }
  .status{
    flex:1 1 220px;min-width:220px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.02);
    padding:14px 18px;
    display:flex;align-items:center;gap:14px;
  }
  .status .sig{
    width:34px;height:34px;flex:none;border-radius:50%;
    display:grid;place-items:center;
    background:#141414;border:1px solid rgba(255,255,255,.14);
  }
  .status .sig svg{width:20px;height:20px}
  .status .txt .st{font-size:11px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
  .status .txt .val{font-size:clamp(1.15rem,3vw,1.5rem);font-weight:700;letter-spacing:-.02em;color:var(--amber);text-transform:uppercase;transition:color .1s linear}
  body.engaged .status .txt .val{color:var(--green)}
  .status .sig .open{display:block}
  .status .sig .closed{display:none}
  body.engaged .status .sig .open{display:none}
  body.engaged .status .sig .closed{display:block}

  .engage{
    flex:0 0 auto;min-width:220px;
    font-family:var(--font);
    font-size:clamp(1rem,2.4vw,1.2rem);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--void);background:var(--silver-hi);
    border:none;padding:0 30px;cursor:pointer;
    position:relative;overflow:hidden;
    box-shadow:0 0 0 1px var(--silver-hi), 6px 6px 0 var(--red);
    transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
  }
  .engage:hover{background:#fff}
  .engage:active{transform:translate(3px,3px);box-shadow:0 0 0 1px var(--silver-hi), 3px 3px 0 var(--red)}
  body.engaged .engage{background:var(--green);box-shadow:0 0 0 1px var(--green), 6px 6px 0 var(--green-dim)}

  /* telemetry strip */
  .telemetry{
    display:flex;gap:0;flex-wrap:wrap;justify-content:center;
    width:min(760px,92vw);
    border:1px solid rgba(255,255,255,.1);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  }
  .telemetry .cell{flex:1 1 120px;min-width:110px;padding:10px 14px;border-right:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px;color:var(--mute)}
  .telemetry .cell:last-child{border-right:none}
  .telemetry .cell b{color:var(--white);font-weight:600}
  .telemetry .cell.live b{color:var(--green)}
  .telemetry .cell .blink{animation:blink 1.4s steps(2) infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .hint{font-size:10px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;text-align:center}
  .hint kbd{border:1px solid rgba(255,255,255,.2);padding:1px 6px;border-radius:3px;color:var(--white)}

  @media (max-width:640px){
    .hud .tick{font-size:9px}
    .hud .tl,.hud .tr{top:16px}.hud .tl{left:16px}.hud .tr{right:16px}
    .hud .bl{left:16px;bottom:20px}.hud .br{right:16px;bottom:20px}
    .telemetry .cell{flex-basis:50%}
  }

  @media (prefers-reduced-motion: reduce){
    .led,.pin-inner,.flash,.assembly,.blink{animation:none!important}
    body.engaged .pin{transition:none;transform:translate3d(-140px,0,0)}
    body.releasing .pin{transition:none}
    .brand .w::after{transition:none}
  }
</style>
</head>
<body>
  <div class="layer grid"></div>
  <div class="layer grid-fine"></div>
  <div class="layer scan"></div>
  <div class="layer vignette"></div>
  <div class="hazard top"></div>
  <div class="hazard"></div>

  <div class="hud">
    <span class="bracket a"></span><span class="bracket b"></span>
    <span class="bracket c"></span><span class="bracket d"></span>
    <div class="tick tl">SYS // <b>RLY-07</b> · <span class="k">LOCKOUT</span></div>
    <div class="tick tr">CIRCUIT <b>Δ</b> <span id="clock">00:00:00</span></div>
    <div class="tick bl">NOM <b>24VDC</b> · <b>IEC 60204-1</b></div>
    <div class="tick br">MODE <b id="mode">MANUAL</b> · <span id="cycle">CYC 000</span></div>
  </div>

  <main>
    <h1 class="brand" aria-label="Hydraulic Relay Lockout">
      <span class="w">HYDRAULIC</span>
      <span class="w">RELAY</span>
      <span class="w lock">LOCKOUT</span>
    </h1>

    <div class="subline">
      <span class="dot" aria-hidden="true"></span>
      <span>SAFETY INTERLOCK</span><span class="sep"></span>
      <span>MECHANISM <b style="color:var(--white)">RLY-07</b></span><span class="sep"></span>
      <span>STATE <b id="stateWord" style="color:var(--amber)">OPEN</b></span>
    </div>

    <div class="mech" id="mech" role="button" tabindex="0" aria-pressed="false" aria-label="Engage hydraulic relay lock">
      <div class="led" aria-hidden="true"></div>
      <div class="assembly">
        <div class="frame">
          <div class="actuator"><span class="cap"></span></div>
          <div class="shaft"></div>
          <div class="housing"><div class="mouth"><span class="lip"></span></div></div>
          <div class="mount"></div>
        </div>
        <div class="pin">
          <div class="pin-inner">
            <span class="grooves"></span>
            <span class="tag">RLY-07</span>
          </div>
        </div>
        <div class="flash" aria-hidden="true"></div>
      </div>
    </div>

    <div class="readout">
      <div class="status" role="status" aria-live="polite">
        <div class="sig" aria-hidden="true">
          <svg class="open" viewBox="0 0 24 24" fill="none" stroke="#FFB703" stroke-width="2.2" stroke-linecap="round"><path d="M7 11V7a5 5 0 0 1 9.9-1"/><rect x="4" y="11" width="16" height="9" rx="1.5"/></svg>
          <svg class="closed" viewBox="0 0 24 24" fill="none" stroke="#06D6A0" stroke-width="2.2" stroke-linecap="round"><path d="M7 11V7a5 5 0 0 1 9.9 0"/><rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M12 14.5v2.5"/></svg>
        </div>
        <div class="txt">
          <div class="st">Interlock Status</div>
          <div class="val" id="statusVal">OPEN · UNLOCKED</div>
        </div>
      </div>
      <button class="engage" id="engage" type="button">Engage Relay</button>
    </div>

    <div class="telemetry">
      <div class="cell"><span>COIL</span><b id="coil">0.00 V</b></div>
      <div class="cell"><span>SEAT</span><b id="seat">0%</b></div>
      <div class="cell live"><span>LINE</span><b class="blink">LIVE</b></div>
      <div class="cell"><span>RESP</span><b id="resp">—</b></div>
    </div>

    <p class="hint">CLICK MECHANISM · PRESS <kbd>SPACE</kbd> TO TOGGLE LOCK</p>
  </main>

<script>
(function(){
  "use strict";
  var body=document.body,
      mech=document.getElementById('mech'),
      engage=document.getElementById('engage'),
      statusVal=document.getElementById('statusVal'),
      stateWord=document.getElementById('stateWord'),
      coil=document.getElementById('coil'),
      seat=document.getElementById('seat'),
      resp=document.getElementById('resp'),
      cycle=document.getElementById('cycle'),
      mode=document.getElementById('mode'),
      clock=document.getElementById('clock');

  var locked=false, cycling=false, cycles=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- responsive mechanism scale ---- */
  function fit(){
    var w=mech.clientWidth;
    var s=Math.max(0.42,Math.min(1, w/760));
    document.documentElement.style.setProperty('--s', s.toFixed(3));
  }
  window.addEventListener('resize',fit,{passive:true});
  fit();

  /* ---- audio: crisp mechanical clunk ---- */
  var actx=null;
  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==='suspended'){ actx.resume(); }
  }
  function clunk(){
    if(!actx) return;
    var t=actx.currentTime;
    // body thud
    var o=actx.createOscillator(), g=actx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(210,t);
    o.frequency.exponentialRampToValueAtTime(48,t+0.13);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.5,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t+0.22);
    // metallic click transient
    var len=Math.floor(actx.sampleRate*0.05);
    var buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2); }
    var src=actx.createBufferSource(); src.buffer=buf;
    var bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=1.2;
    var g2=actx.createGain(); g2.gain.value=0.35;
    src.connect(bp).connect(g2).connect(actx.destination);
    src.start(t);
  }

  /* ---- telemetry readouts ---- */
  function setReadout(engaged){
    if(engaged){
      statusVal.textContent='LOCKED · SECURED';
      stateWord.textContent='CLOSED';
      stateWord.style.color='var(--green)';
      coil.textContent='24.00 V';
      seat.textContent='100%';
      resp.textContent='0.042 s';
    }else{
      statusVal.textContent='OPEN · UNLOCKED';
      stateWord.textContent='OPEN';
      stateWord.style.color='var(--amber)';
      coil.textContent='0.00 V';
      seat.textContent='0%';
      resp.textContent='—';
    }
  }

  function toggle(){
    if(cycling) return;
    ensureAudio();
    cycling=true;
    if(!locked){
      locked=true;
      body.classList.remove('releasing');
      body.classList.add('engaged');
      mech.setAttribute('aria-pressed','true');
      cycles++; cycle.textContent='CYC '+String(cycles).padStart(3,'0');
      // snap + clunk + LED at impact moment (~0.5s)
      var delay = reduce ? 0 : 500;
      setTimeout(function(){
        clunk();
        setReadout(true);
        cycling=false;
      }, delay);
    }else{
      locked=false;
      body.classList.remove('engaged');
      body.classList.add('releasing');
      mech.setAttribute('aria-pressed','false');
      setReadout(false);
      var dur = reduce ? 120 : 820;
      setTimeout(function(){ body.classList.remove('releasing'); cycling=false; }, dur);
    }
  }

  mech.addEventListener('click',toggle);
  engage.addEventListener('click',function(e){ e.stopPropagation(); toggle(); });
  mech.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); }
  });

  /* ---- live clock ---- */
  function pad(n){return String(n).padStart(2,'0');}
  function tickClock(){
    var d=new Date();
    clock.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  tickClock(); setInterval(tickClock,1000);
})();
</script>
</body>
