<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLIS DEEP — Aquamarine Silk Drape Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a2028;
    --deep:#0f2b33;
    --saline:#4a7c8c;
    --foam:#d0e8eb;
    --accent:#8bbdd6;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --display:'Cormorant Garamond',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void);
    color:var(--foam);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* ---- HUD ---- */
  .hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,2.4vw,30px)}
  .hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .hud-row.bottom{align-items:flex-end}
  .mono{font-family:var(--mono);font-weight:300;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(208,232,235,.5)}
  .mono.accent{color:var(--accent)}
  .mono b{font-weight:400;color:var(--foam)}
  .brandmark{display:flex;align-items:center;gap:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .hint{color:rgba(208,232,235,.42);max-width:230px;line-height:1.7}
  .legend{display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end;text-align:right}
  .legend .item{display:flex;flex-direction:column;gap:5px}
  .legend .item span:last-child{color:rgba(208,232,235,.42)}

  /* ---- Brand reveal ---- */
  .brand-layer{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vw,26px);pointer-events:none;padding:0 6vw;text-align:center}
  .brand{
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(3.2rem,12.5vw,11.5rem);
    line-height:.86;
    letter-spacing:.015em;
    color:var(--foam);
    text-shadow:0 0 46px rgba(139,189,214,.22);
    opacity:0;
    animation:brandIn 2.8s ease 1.1s forwards;
  }
  .brand em{font-style:normal;font-weight:400;color:#fff}
  .sub{
    font-family:var(--mono);
    font-size:clamp(9px,1.1vw,11px);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(208,232,235,.72);
    opacity:0;
    animation:brandIn 2.4s ease 1.7s forwards;
  }
  @keyframes brandIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .noscript{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);color:var(--saline);z-index:5}

  @media (max-width:640px){
    .hint{max-width:150px;font-size:9px}
    .legend{gap:12px}
    .brand-layer{justify-content:flex-end;padding-bottom:20vh}
  }

  @media (prefers-reduced-motion:reduce){
    .dot{animation:none;opacity:.8}
    .brand,.sub{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="brand-layer">
  <h1 class="brand">SOLIS <em>DEEP</em></h1>
  <p class="sub">Aquamarine Silk · Submerged Tide</p>
</div>

<div class="hud">
  <div class="hud-row">
    <div class="brandmark">
      <span class="dot"></span>
      <span class="mono accent">SOLIS&nbsp;DEEP</span>
    </div>
    <div class="mono">Study&nbsp;04 — <b>Silk Drape Tide</b></div>
  </div>
  <div class="hud-row bottom">
    <div class="mono hint">Hover the silk to press the tide flat — the weave clears, the name surfaces.</div>
    <div class="legend">
      <div class="item"><span class="mono">Depth</span><span class="mono">−412 m</span></div>
      <div class="item"><span class="mono">Refraction</span><span class="mono">η 1.47</span></div>
      <div class="item"><span class="mono">Cycle</span><span class="mono">3.6 s tide</span></div>
    </div>
  </div>
</div>

<div class="noscript" hidden>WebGL is required to view this study.</div>

<script>
(function(){
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', {antialias:true, alpha:false, premultipliedAlpha:false});
  if(!gl){ document.querySelector('.noscript').hidden=false; return; }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- shaders ---------- */
  const VERT = `
    attribute vec2 a_pos;
    void main(){ gl_Position = vec4(a_pos,0.0,1.0); }
  `;

  const FRAG = `
    precision highp float;
    uniform vec2  u_res;
    uniform float u_time;
    uniform vec2  u_mouse;
    uniform float u_hover;
    uniform float u_aspect;
    uniform float u_mobile;

    float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));
      vec2 u=f*f*(3.-2.*f);
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }
    float fbm(vec2 p){
      float v=0.0, a=0.5;
      for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.02+vec2(1.7,9.2); a*=0.5; }
      return v;
    }

    void main(){
      vec2 uv = gl_FragCoord.xy/u_res.xy;
      float t = u_time;

      /* settle envelope: heavy damped drop-in, no bounce */
      float settle = 1.0 - exp(-1.35*t);
      float amp = 0.85 + 0.15*settle;

      /* horizontal tide — slow, submerged weight, left to right */
      float w1 = sin(uv.x*4.6 - t*0.55);
      float w2 = sin(uv.x*2.3 + uv.y*1.4 - t*0.34);
      float w3 = sin(uv.x*8.2 - t*0.9 + uv.y*2.1);
      float tide = (w1*0.6 + w2*0.32 + w3*0.16) * amp;

      /* gentle breathing so the cloth feels alive */
      float breathe = sin(t*0.42 + uv.x*1.1)*0.05;

      /* drape field: heavy sheet hanging from top, covering ~60% width */
      float cx = 0.5 + (uv.y-0.5)*0.10;
      float edge = 0.30 + 0.045*sin(uv.y*3.0 + t*0.3) + 0.02*fbm(vec2(uv.y*3.0, t*0.15));
      float drape = smoothstep(edge, edge-0.13, abs(uv.x-cx));

      /* vertical fall-off — bottom edge dissolves into the void */
      float vfall = smoothstep(0.0, 0.30, uv.y);

      float body = drape * vfall;

      /* height field (drives shading + caustics) */
      float height = tide*0.5 + breathe;

      /* gradient via finite differences -> lighting normal */
      float e = 0.006;
      float hR = (sin((uv.x+e)*4.6 - t*0.55)*0.6 + sin((uv.x+e)*2.3 + uv.y*1.4 - t*0.34)*0.32 + sin((uv.x+e)*8.2 - t*0.9 + uv.y*2.1)*0.16)*amp;
      float hU = (sin(uv.x*4.6 - t*0.55)*0.6 + sin(uv.x*2.3 + (uv.y+e)*1.4 - t*0.34)*0.32 + sin(uv.x*8.2 - t*0.9 + (uv.y+e)*2.1)*0.16)*amp;
      vec2 grad = vec2(hR - h, hU - h)/e;

      /* caustics — light refracted INSIDE the weave (subsurface feel) */
      vec2 cu = uv*vec2(3.4,2.6) + vec2(t*0.06, -t*0.03);
      float caust = fbm(cu + fbm(cu*1.7 - t*0.05)*0.9);
      caust = smoothstep(0.42, 0.92, caust);

      /* base palette: deep saline -> foam at peaks */
      vec3 deep  = vec3(0.059,0.169,0.200);
      vec3 saline= vec3(0.290,0.486,0.549);
      vec3 foam  = vec3(0.816,0.910,0.922);
      vec3 accent= vec3(0.545,0.741,0.839);

      float peak = smoothstep(-0.2, 0.95, height);
      float thin = smoothstep(0.0, 0.55, body) * smoothstep(0.95, 0.0, body); /* thin at edges -> glow */

      vec3 col = mix(deep, saline, clamp(height*0.5+0.5, 0.0, 1.0));
      col = mix(col, foam, peak*0.6);

      /* subsurface: thin areas glow with accent caustic light */
      col += accent * caust * thin * 0.55;
      col += accent * caust * 0.10; /* faint caustic even in body */

      /* sheen — soft directional specular, high index wet silk */
      float sheen = pow(max(0.0, -grad.x*0.5 - grad.y*0.35), 1.6);
      col += foam * sheen * 0.35;

      /* deep shadow in troughs */
      col *= 0.72 + 0.5*smoothstep(-1.2, 1.0, height);

      /* interaction: cursor presses the tide flat + clears a lens */
      vec2 m = u_mouse;
      float md = distance(uv, m);
      float radius = 0.17 + 0.02*sin(t*1.3);
      float press = smoothstep(radius, 0.0, md) * u_hover;

      /* ripple rings emanating from the pressure point */
      float ring = sin(md*38.0 - t*2.4);
      float ringF = smoothstep(radius, 0.0, md) * ring * 0.25 * u_hover;

      /* tighten: flatten amplitude + add crisp ring highlight */
      col = mix(col, col*0.9 + foam*0.12, press*0.7);
      col += accent * ringF * 0.5;

      /* opacity: cloth is translucent; the lens clears it to reveal the brand */
      float baseA = body * (0.72 + 0.16*peak);
      float a = baseA * (1.0 - press*0.92);
      a += ringF*0.05;
      a = clamp(a, 0.0, 1.0);

      /* deep void background — pure depth, no gradient noise */
      float vig = smoothstep(1.25, 0.25, length((uv-0.5)*vec2(u_aspect,1.0)));
      vec3 bg = vec3(0.016,0.055,0.070) * (0.5 + 0.5*vig);
      bg += accent * 0.02 * caust; /* faint ambient light in the water */

      /* premultiplied composite over the void */
      vec3 outc = col*a + bg*(1.0-a);
      outc = pow(outc, vec3(0.92)); /* gentle tonemap lift */

      gl_FragColor = vec4(outc, 1.0);
    }
  `;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAG_SHADER ? gl.FRAG_SHADER : gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {
    res:   gl.getUniformLocation(prog,'u_res'),
    time:  gl.getUniformLocation(prog,'u_time'),
    mouse: gl.getUniformLocation(prog,'u_mouse'),
    hover: gl.getUniformLocation(prog,'u_hover'),
    aspect:gl.getUniformLocation(prog,'u_aspect'),
    mobile:gl.getUniformLocation(prog,'u_mobile')
  };

  /* ---------- sizing ---------- */
  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = Math.floor(innerWidth*DPR);
    H = Math.floor(innerHeight*DPR);
    canvas.width=W; canvas.height=H;
    gl.viewport(0,0,W,H);
    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.aspect, W/H);
    gl.uniform1f(U.mobile, innerWidth<640?1.0:0.0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- interaction ---------- */
  let mx=0.5, my=0.5, tmx=0.5, tmy=0.5, hover=0, thover=0;
  function setPointer(cx, cy){
    const r = canvas.getBoundingClientRect();
    tmx = (cx-r.left)/r.width;
    tmy = 1.0 - (cy-r.top)/r.height;
  }
  window.addEventListener('mousemove', e=>{ setPointer(e.clientX,e.clientY); thover=1; });
  window.addEventListener('mouseleave', ()=>{ thover=0; });
  window.addEventListener('touchstart', e=>{ if(e.touches[0]){ setPointer(e.touches[0].clientX,e.touches[0].clientY); thover=1; } }, {passive:true});
  window.addEventListener('touchmove',  e=>{ if(e.touches[0]){ setPointer(e.touches[0].clientX,e.touches[0].clientY); thover=1; } }, {passive:true});
  window.addEventListener('touchend',   ()=>{ thover=0; });

  /* ---------- loop ---------- */
  const start = performance.now();
  function frame(now){
    const t = (now-start)/1000;
    /* smooth pointer + hover easing (submerged inertia) */
    mx += (tmx-mx)*0.08; my += (tmy-my)*0.08;
    hover += (thover-hover)*0.06;

    const animT = reduced ? 1.6 : t; /* reduced: hold a calm settled state */

    gl.uniform1f(U.time, animT);
    gl.uniform2f(U.mouse, mx, my);
    gl.uniform1f(U.hover, reduced ? 0.0 : hover);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
