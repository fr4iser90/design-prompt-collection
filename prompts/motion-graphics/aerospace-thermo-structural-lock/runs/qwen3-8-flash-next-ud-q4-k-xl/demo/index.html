<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="The Thermal Lockup — a technical explainer of thermal locking in aerospace structures.">
<title>The Thermal Lockup — Aerospace Structural Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F172A;
    --ink:#F8FAFC;
    --slate:#E2E8F0;
    --dim:#94A3B8;
    --grid:#1E293B;
    --accent:#06B6D4;
    --font-display:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--slate);
    font-family:var(--font-mono);
    display:grid;
    place-items:center;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .stage{
    position:relative;
    width:min(100vw,177.78vh);
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
    container-type:size;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage::after{
    content:"";
    position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%);
  }

  /* --- blueprint grid --- */
  .grid{
    position:absolute;inset:0;z-index:1;opacity:0;
    background-image:
      linear-gradient(to right,var(--grid) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
    background-size:clamp(26px,3.2vmin,46px) clamp(26px,3.2vmin,46px);
    background-position:center;
  }

  /* --- technical overlay --- */
  .overlay{position:absolute;inset:0;z-index:4;pointer-events:none;}
  .corner{
    position:absolute;width:18px;height:18px;
    border:1px solid rgba(148,163,184,.4);
  }
  .corner.tl{top:16px;left:16px;border-right:0;border-bottom:0;}
  .corner.tr{top:16px;right:16px;border-left:0;border-bottom:0;}
  .corner.bl{bottom:16px;left:16px;border-right:0;border-top:0;}
  .corner.br{bottom:16px;right:16px;border-left:0;border-top:0;}

  .hud{
    position:absolute;font-size:clamp(9px,1.15cqw,14px);
    line-height:1.85;letter-spacing:.04em;
  }
  .hud-tl{top:clamp(26px,3.4cqw,42px);left:clamp(30px,3.8cqw,50px);}
  .hud-tr{top:clamp(26px,3.4cqw,42px);right:clamp(30px,3.8cqw,50px);text-align:right;}
  .hud-bl{bottom:clamp(26px,3.4cqw,42px);left:clamp(30px,3.8cqw,50px);}
  .hud-br{bottom:clamp(26px,3.4cqw,42px);right:clamp(30px,3.8cqw,50px);text-align:right;}
  .k{color:var(--dim);letter-spacing:.18em;}
  .v{color:var(--slate);font-weight:500;}
  .v.accent{color:var(--accent);}
  .v.dim{color:var(--dim);}
  .big{font-size:1.7em;font-weight:500;color:var(--slate);letter-spacing:.02em;}
  .big .deg{font-size:.55em;color:var(--dim);margin-left:.15em;}
  .v.accent.big{color:var(--accent);text-shadow:0 0 14px rgba(6,182,212,.4);}
  .v.locked{color:var(--accent);font-weight:700;text-shadow:0 0 14px rgba(6,182,212,.5);}
  .v.warn{color:var(--accent);}
  .v.ok{color:var(--dim);}

  .title{
    position:absolute;left:0;right:0;bottom:clamp(120px,15cqw,190px);
    text-align:center;font-family:var(--font-display);font-weight:600;
    font-size:clamp(20px,4.8cqw,58px);letter-spacing:.1em;color:var(--ink);
    text-transform:uppercase;opacity:0;z-index:4;
  }
  .title::after{
    content:"";display:block;width:clamp(120px,16cqw,220px);height:1px;
    margin:clamp(10px,1.4cqw,18px) auto 0;
    background:linear-gradient(90deg,transparent,var(--grid),transparent);
  }

  /* --- svg --- */
  svg{position:absolute;inset:0;z-index:2;width:100%;height:100%;display:block;}
  #assembly{transform-box:view-box;transform-origin:300px 200px;will-change:transform;}
  .plate{fill:#0B1220;stroke:var(--slate);stroke-width:2;vector-effect:non-scaling-stroke;}
  .rivet{fill:#0B1220;stroke:var(--slate);stroke-width:2;vector-effect:non-scaling-stroke;}
  .centerline{stroke:var(--dim);stroke-width:1;stroke-dasharray:7 6;opacity:.5;vector-effect:non-scaling-stroke;}
  .anno{stroke:var(--dim);stroke-width:1;opacity:.7;vector-effect:non-scaling-stroke;}
  .anno-tick{stroke:var(--dim);stroke-width:1;opacity:.7;vector-effect:non-scaling-stroke;}
  .anno-text{fill:var(--dim);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;}
  .anno-text.dim{fill:var(--dim);opacity:.7;}
  .anno-text.accent{fill:var(--accent);opacity:0;}
  .anno-text.locked{fill:var(--accent);}
  .glow{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;vector-effect:non-scaling-stroke;}
  .heat{fill:url(#heatGrad);opacity:0;mix-blend-mode:screen;}
  .lockbar{fill:var(--dim);opacity:.6;}
  .lockbar.on{fill:var(--accent);opacity:1;}
  .locktri{fill:none;stroke:var(--dim);stroke-width:1.5;opacity:.6;vector-effect:non-scaling-stroke;}
  .locktri.on{fill:var(--accent);stroke:var(--accent);opacity:1;}

  /* --- timeline scrubber --- */
  .timeline{
    position:absolute;left:50%;bottom:clamp(24px,3.2cqw,40px);transform:translateX(-50%);
    z-index:6;width:clamp(260px,42cqw,560px);height:22px;cursor:pointer;
  }
  .track{position:absolute;top:10px;left:0;right:0;height:2px;background:rgba(148,163,184,.2);}
  .progress{position:absolute;top:0;left:0;height:100%;width:0;background:var(--accent);box-shadow:0 0 8px rgba(6,182,212,.6);}
  .ticks{position:absolute;inset:0;}
  .tick{position:absolute;top:5px;width:1px;height:12px;background:rgba(148,163,184,.45);}
  .tick span{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--dim);letter-spacing:.1em;}
  .playhead{position:absolute;top:3px;left:0;width:2px;height:16px;background:var(--slate);transform:translateX(-1px);box-shadow:0 0 6px rgba(226,232,240,.5);}

  .hint{
    position:absolute;top:clamp(15px,2cqw,22px);left:50%;transform:translateX(-50%);
    z-index:6;font-size:clamp(8px,.95cqw,11px);letter-spacing:.28em;color:rgba(148,163,184,.55);
    text-transform:uppercase;transition:opacity .6s;pointer-events:none;
  }
  .hint.hidden{opacity:0;}

  .poster{
    position:absolute;inset:0;z-index:20;display:none;place-items:center;
    background:var(--bg);text-align:center;padding:6vw;
  }
  .poster h1{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,5vw,56px);letter-spacing:.1em;color:var(--ink);}
  .poster p{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:.24em;text-transform:uppercase;}
  .poster .pgrid{position:absolute;inset:0;z-index:-1;opacity:.5;
    background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
    background-size:clamp(26px,3.2vmin,46px) clamp(26px,3.2vmin,46px);background-position:center;}

  @media (prefers-reduced-motion: reduce){
    .stage{cursor:default;}
    .timeline,.hint{display:none;}
    .poster{display:grid;}
  }
</style>
</head>
<body>
  <div class="stage" id="stage" role="img" aria-label="The Thermal Lockup: a titanium rivet assembly heating from 20 degrees to 450 degrees Celsius and thermally locking into place.">
    <div class="grid" id="grid"></div>

    <svg viewBox="0 0 600 338" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="heatGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#06B6D4" stop-opacity="0"/>
          <stop offset="0.4" stop-color="#06B6D4" stop-opacity="0.55"/>
          <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.85"/>
          <stop offset="0.6" stop-color="#06B6D4" stop-opacity="0.55"/>
          <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="clip">
          <rect x="150" y="150" width="300" height="44" rx="4"/>
          <circle cx="300" cy="150" r="26"/>
          <rect x="288" y="150" width="24" height="130"/>
          <circle cx="300" cy="280" r="16"/>
        </clipPath>
      </defs>

      <g id="assembly">
        <!-- horizontal plate element -->
        <rect class="plate" id="plate" x="150" y="150" width="300" height="44" rx="4"/>
        <!-- rivet: head circle, shank, bottom circle -->
        <circle class="rivet" id="head" cx="300" cy="150" r="26"/>
        <rect class="rivet" id="shank" x="288" y="150" width="24" height="130"/>
        <circle class="rivet" id="bottom" cx="300" cy="280" r="16"/>

        <!-- heat gradient clipped to metal -->
        <rect id="heat" class="heat" clip-path="url(#clip)" x="0" y="0" width="600" height="338"/>

        <!-- cyan glow overlay -->
        <g id="glow">
          <rect class="glow" x="150" y="150" width="300" height="44" rx="4"/>
          <circle class="glow" cx="300" cy="150" r="26"/>
          <rect class="glow" x="288" y="150" width="24" height="130"/>
          <circle class="glow" cx="300" cy="280" r="16"/>
        </g>

        <!-- centerline + annotations -->
        <line class="centerline" id="cline" x1="300" y1="96" x2="300" y2="312"/>

        <line class="anno" id="vline" x1="245" y1="110" x2="245" y2="280"/>
        <line class="anno-tick" x1="241" y1="110" x2="249" y2="110"/>
        <line class="anno-tick" x1="241" y1="280" x2="249" y2="280"/>
        <text class="anno-text" id="lenText" x="239" y="195" text-anchor="end">170.000</text>

        <line class="anno" id="hline" x1="314" y1="124" x2="360" y2="124"/>
        <line class="anno-tick" x1="314" y1="120" x2="314" y2="128"/>
        <line class="anno-tick" x1="360" y1="120" x2="360" y2="128"/>
        <text class="anno-text" id="diaText" x="366" y="128" text-anchor="start">Ø 52.000</text>

        <text class="anno-text dim" x="466" y="166" text-anchor="start">PLATE</text>
        <text class="anno-text dim" x="466" y="182" text-anchor="start">Ti-6Al-4V</text>

        <text class="anno-text" x="330" y="262" text-anchor="start">TOL ±0.05</text>
        <text class="anno-text accent" id="clearText" x="330" y="278" text-anchor="start">CLR 0.000</text>
      </g>

      <!-- lock indicator (static, outside assembly) -->
      <g id="lockIndicator">
        <rect class="lockbar" id="lockbar" x="470" y="270" width="60" height="3"/>
        <path class="locktri" id="locktri" d="M455 271.5 l-9 -6 v12 z"/>
        <text class="anno-text" id="lockText" x="470" y="262" text-anchor="start">UNLOCKED</text>
      </g>
    </svg>

    <div class="overlay">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <div class="hud hud-tl">
        <div><span class="k">SPEC</span> <span class="v">AERO-STR / 07</span></div>
        <div><span class="k">MATL</span> <span class="v">Ti-6Al-4V</span></div>
        <div><span class="k">JOINT</span> <span class="v">RIVET · Ø12</span></div>
      </div>

      <div class="hud hud-tr">
        <div><span class="k">TEMP</span></div>
        <div class="big"><span id="tempVal" class="v">20.0</span><span class="deg">°C</span></div>
        <div><span class="k">TOL</span> <span class="v">±0.05 mm</span></div>
      </div>

      <div class="hud hud-bl">
        <div><span class="k">STATUS</span> <span id="statusVal" class="v">COLD</span></div>
        <div><span class="k">PHASE</span> <span id="phaseVal" class="v dim">01 / 04</span></div>
      </div>

      <div class="hud hud-br">
        <div><span class="k">LOOP</span> <span class="v">6.000 s</span></div>
        <div><span class="k">RENDER</span> <span class="v">60 FPS</span></div>
        <div><span class="k">CYCLE</span> <span id="cycleVal" class="v">001</span></div>
      </div>
    </div>

    <div class="title" id="title">Thermal Lock</div>

    <div class="hint" id="hint">Click or press Space to replay</div>

    <div class="timeline" id="timeline">
      <div class="track"><div class="progress" id="progress"></div></div>
      <div class="ticks">
        <div class="tick" style="left:0%"><span>0</span></div>
        <div class="tick" style="left:25%"><span>1.5</span></div>
        <div class="tick" style="left:50%"><span>3.0</span></div>
        <div class="tick" style="left:75%"><span>4.5</span></div>
        <div class="tick" style="left:100%"><span>6.0</span></div>
      </div>
      <div class="playhead" id="playhead"></div>
    </div>

    <div class="poster">
      <div class="pgrid"></div>
      <div>
        <h1>Thermal Lock</h1>
        <p>20 °C → 450 °C · Static Poster Frame</p>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var DURATION = 6000; // ms

  // ---- element refs ----
  var grid = document.getElementById('grid');
  var title = document.getElementById('title');
  var assembly = document.getElementById('assembly');
  var heat = document.getElementById('heat');
  var glow = document.getElementById('glow');
  var lockbar = document.getElementById('lockbar');
  var locktri = document.getElementById('locktri');
  var lockText = document.getElementById('lockText');
  var clearText = document.getElementById('clearText');
  var lenText = document.getElementById('lenText');
  var diaText = document.getElementById('diaText');
  var tempVal = document.getElementById('tempVal');
  var statusVal = document.getElementById('statusVal');
  var phaseVal = document.getElementById('phaseVal');
  var cycleVal = document.getElementById('cycleVal');
  var progress = document.getElementById('progress');
  var playhead = document.getElementById('playhead');
  var timeline = document.getElementById('timeline');
  var hint = document.getElementById('hint');
  var stage = document.getElementById('stage');

  // ---- draw-in targets ----
  var drawEls = ['plate','head','shank','bottom','cline','vline','hline']
    .map(function(id){ return document.getElementById(id); });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- easing helpers ----
  function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }
  function easeInCubic(t){ return t*t*t; }
  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
  // cubic-bezier(0.16,1,0.3,1) — decisive snap
  function cubicBezier(p1x,p1y,p2x,p2y){
    var cx=3*p1x, bx=3*(p2x-p1x)-cx, ax=1-cx-bx;
    var cy=3*p1y, by=3*(p2y-p1y)-cy, ay=1-cy-by;
    function sx(t){ return ((ax*t+bx)*t+cx)*t; }
    function sy(t){ return ((ay*t+by)*t+cy)*t; }
    function dx(t){ return (3*ax*t+2*bx)*t+cx; }
    function solve(x){
      var t=x,i,e,d;
      for(i=0;i<8;i++){ e=sx(t)-x; if(Math.abs(e)<1e-5) return t; d=dx(t); if(Math.abs(d)<1e-6) break; t-=e/d; }
      var lo=0,hi=1; t=x;
      while(lo<hi){ e=sx(t); if(Math.abs(e-x)<1e-5) break; if(x>e) lo=t; else hi=t; t=(lo+hi)/2; }
      return t;
    }
    return function(x){ return x<=0?0:(x>=1?1:sy(solve(x))); };
  }
  var snapEase = cubicBezier(0.16,1,0.3,1);

  // ---- stroke draw-in setup ----
  var dash = [];
  function setupDraw(){
    dash = drawEls.map(function(el){
      var len = el.getTotalLength();
      el.style.strokeDasharray = len + ' ' + len;
      return len;
    });
  }
  setupDraw();
  window.addEventListener('resize', setupDraw);

  // ---- beat timing (ms) ----
  var T = {
    gridStart:0, gridEnd:700,
    drawStart:250, drawEnd:1300,
    titleStart:800, titleEnd:1300,
    heatStart:1500, heatEnd:3000,
    lockStart:3000, lockEnd:3500,
    coolStart:4500, coolEnd:6000
  };

  // ---- render one frame at time t (ms) ----
  function render(t){
    // grid fade in
    grid.style.opacity = easeOutCubic(clamp01((t - T.gridStart)/(T.gridEnd - T.gridStart)));

    // structure draw-in (linear)
    var dp = clamp01((t - T.drawStart)/(T.drawEnd - T.drawStart));
    for(var i=0;i<drawEls.length;i++){
      drawEls[i].style.strokeDashoffset = (dash[i] * (1 - dp));
    }

    // title fade
    title.style.opacity = easeOutCubic(clamp01((t - T.titleStart)/(T.titleEnd - T.titleStart)));

    // temperature
    var temp;
    if(t < T.heatStart) temp = 20;
    else if(t < T.heatEnd) temp = lerp(20, 450, easeInOutCubic((t - T.heatStart)/(T.heatEnd - T.heatStart)));
    else if(t < T.coolStart) temp = 450;
    else temp = lerp(450, 20, easeInOutCubic((t - T.coolStart)/(T.coolEnd - T.coolStart)));
    tempVal.textContent = temp.toFixed(1);

    // expansion factor (0 -> 1)
    var exp;
    if(t < T.heatStart) exp = 0;
    else if(t < T.lockStart) exp = easeInOutCubic((t - T.heatStart)/(T.lockStart - T.heatStart)) * 0.96;
    else if(t < T.lockEnd) exp = lerp(0.96, 1, snapEase((t - T.lockStart)/(T.lockEnd - T.lockStart)));
    else exp = 1;

    // heat wave sweep + intensity
    var heatP = clamp01((t - T.heatStart)/(T.heatEnd - T.heatStart));
    var heatIntensity = (t >= T.heatStart && t <= T.coolEnd) ? Math.sin(Math.PI * clamp01((t - T.heatStart)/(T.coolEnd - T.heatStart))) : 0;
    heat.setAttribute('x', (lerp(-600, 600, heatP)).toFixed(1));
    heat.style.opacity = (heatIntensity * 0.9).toFixed(3);
    glow.style.opacity = (heatIntensity * 0.55).toFixed(3);

    // apply transform (heavy / material feel)
    assembly.style.transform = 'scale(' + (1 + exp * 0.03).toFixed(4) + ')';

    // lock indicator
    var locked = (t >= T.lockStart);
    lockbar.classList.toggle('on', locked);
    locktri.classList.toggle('on', locked);
    lockText.textContent = locked ? 'LOCKED' : 'UNLOCKED';
    lockText.classList.toggle('locked', locked);

    // clearance readout
    var clr = (1 - exp) * 0.05;
    clearText.textContent = 'CLR ' + clr.toFixed(3);
    clearText.classList.toggle('locked', locked);

    // dimension readouts
    lenText.textContent = (170 * (1 + exp * 0.03)).toFixed(3);
    diaText.textContent = 'Ø ' + (52 * (1 + exp * 0.03)).toFixed(3);

    // status / phase
    var status, phase;
    if(t < T.heatStart){ status='COLD'; phase='01 / 04'; }
    else if(t < T.lockStart){ status='EXPANDING'; phase='02 / 04'; }
    else if(t < T.coolStart){ status='LOCKED'; phase='03 / 04'; }
    else { status='COOLING'; phase='04 / 04'; }
    statusVal.textContent = status;
    statusVal.className = 'v' + (status === 'LOCKED' ? ' locked' : (status === 'EXPANDING' ? ' accent' : ''));
    phaseVal.textContent = phase;

    // timeline
    var pct = (t / DURATION) * 100;
    progress.style.width = pct.toFixed(2) + '%';
    playhead.style.left = pct.toFixed(2) + '%';
  }

  // ---- loop control ----
  var startTime = null, cycle = 0, raf = 0;

  function frame(now){
    if(startTime === null) startTime = now;
    var t = (now - startTime) % DURATION;
    if(now - startTime >= DURATION){
      cycle++;
      cycleVal.textContent = String(cycle).padStart(3,'0');
    }
    render(t);
    raf = requestAnimationFrame(frame);
  }

  function play(){
    if(reduced) return;
    cancelAnimationFrame(raf);
    startTime = null;
    raf = requestAnimationFrame(frame);
  }

  function restart(){
    startTime = null;
    cycle = 0;
    cycleVal.textContent = '001';
    hint.classList.add('hidden');
    if(!reduced){ cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  }

  // ---- scrubber ----
  var dragging = false;
  function seek(e){
    var r = timeline.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var t = clamp01(x / r.width) * DURATION;
    cancelAnimationFrame(raf);
    startTime = null;
    render(t);
  }
  timeline.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    dragging = true;
    hint.classList.add('hidden');
    seek(e);
  });
  window.addEventListener('pointermove', function(e){ if(dragging) seek(e); });
  window.addEventListener('pointerup', function(){
    if(dragging){ dragging = false; play(); }
  });

  // ---- keyboard ----
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); restart(); }
  });
  // ---- click to restart (not on scrubber) ----
  stage.addEventListener('click', function(e){
    if(e.target.closest('.timeline')) return;
    restart();
  });

  // ---- init ----
  if(reduced){
    // static poster frame at 1.5s
    render(1500);
    // ensure fully drawn + poster frame look
    grid.style.opacity = 1;
    title.style.opacity = 1;
    for(var i=0;i<drawEls.length;i++){ drawEls[i].style.strokeDashoffset = 0; }
  } else {
    play();
    setTimeout(function(){ hint.classList.add('hidden'); }, 6000);
  }
})();
</script>
