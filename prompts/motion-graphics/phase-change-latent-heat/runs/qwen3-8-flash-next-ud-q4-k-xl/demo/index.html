<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThermoStore — Latent Heat Buffer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#212121;
    --ink:#F5F5F5;
    --amber:#FFC107;
    --blue:#2196F3;
    --grey:#8A8A8A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#171717;
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:var(--bg);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .overlay{position:absolute;inset:0;pointer-events:none;}
  .overlay svg{position:absolute;inset:0;width:100%;height:100%;}
  .display{font-family:'Syne',sans-serif;}
  .body{font-family:'IBM Plex Sans',sans-serif;}

  /* ---- Heat bar glow (CSS) ---- */
  #heatGlow{
    position:absolute;left:50%;top:0;
    width:46%;height:46%;
    transform:translate(-50%,-100%);
    background:radial-gradient(ellipse 62% 50% at 50% 0%, rgba(255,193,7,.30), rgba(255,193,7,0) 70%);
    filter:blur(24px);pointer-events:none;
  }

  /* ---- Labels ---- */
  .label{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    white-space:nowrap;
    opacity:0;
    will-change:opacity,transform;
  }
  #heatIn{
    font-family:'Syne';font-weight:800;
    font-size:clamp(20px,4.4vw,56px);
    letter-spacing:.02em;color:var(--ink);
  }
  #heatIn .accent{color:var(--amber);}
  #phase{
    font-family:'IBM Plex Sans';font-weight:400;
    font-size:clamp(11px,1.5vw,17px);
    letter-spacing:.42em;text-transform:uppercase;color:var(--amber);
  }
  #stable{
    font-family:'Syne';font-weight:700;
    font-size:clamp(15px,2.5vw,30px);
    letter-spacing:.18em;color:var(--blue);
  }

  /* ---- Lockup ---- */
  #lockup{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    text-align:center;opacity:0;white-space:nowrap;
  }
  #lockup .wordmark{
    font-family:'Syne';font-weight:800;
    font-size:clamp(34px,7vw,92px);
    letter-spacing:-.01em;color:var(--ink);line-height:.92;
  }
  #lockup .tagline{
    font-family:'IBM Plex Sans';font-weight:400;
    font-size:clamp(11px,1.4vw,16px);
    letter-spacing:.5em;text-transform:uppercase;color:var(--grey);
    margin-top:.9em;
  }

  /* ---- Restart affordance ---- */
  #restart{
    position:absolute;right:14px;bottom:12px;
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Sans';font-weight:400;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.35);pointer-events:none;
    transition:opacity .3s;
  }
  #restart .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);}

  @media (prefers-reduced-motion: reduce){
    #restart{display:none;}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="heatGlow"></div>

    <!-- MAIN SCENE -->
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M30 0H0V30" fill="none" stroke="#212121" stroke-width="1.1"/>
        </pattern>
        <pattern id="flow" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M0 15 Q 7.5 7.5 15 15 T 30 15" fill="none" stroke="#FFC107" stroke-width="1.3" opacity="0.55"/>
        </pattern>
        <linearGradient id="meltGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#FFC107" stop-opacity="0.55"/>
          <stop offset="55%" stop-color="#FFC107" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="heatGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#FFC107" stop-opacity="0.10"/>
          <stop offset="55%" stop-color="#FFC107" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#FFC107" stop-opacity="0.95"/>
        </linearGradient>
        <clipPath id="blockClip"><rect id="blockClipRect" x="560" y="360" width="480" height="280" rx="4"/></clipPath>
      </defs>

      <!-- PCM block -->
      <g id="block">
        <rect x="560" y="360" width="480" height="280" rx="4" fill="#F5F5F5"/>
        <rect x="560" y="360" width="480" height="280" rx="4" fill="url(#grid)" opacity="0.16"/>
      </g>

      <!-- Melting overlay (clipped to block) -->
      <g clip-path="url(#blockClip)">
        <rect id="meltGradRect" x="560" y="360" width="480" height="280" fill="url(#meltGrad)"/>
        <rect id="meltFlowRect" x="560" y="360" width="480" height="280" fill="url(#flow)"/>
        <rect id="meltLine" x="560" y="360" width="480" height="3" fill="#FFC107"/>
      </g>

      <!-- Block outline -->
      <rect x="560" y="360" width="480" height="280" rx="4" fill="none" stroke="#F5F5F5" stroke-width="2" opacity="0.9"/>

      <!-- Heat bar -->
      <g id="heat">
        <rect x="620" y="0" width="360" height="46" rx="3" fill="#FFC107"/>
        <rect x="620" y="46" width="360" height="130" fill="url(#heatGrad)"/>
      </g>

      <!-- Energy release arrows -->
      <g id="arrows"></g>

      <!-- Temperature graph -->
      <g id="graph">
        <rect x="1112" y="628" width="436" height="228" rx="6" fill="#000000" opacity="0.16"/>
        <line x1="1142" y1="648" x2="1142" y2="830" stroke="#4A4A4A" stroke-width="1.4"/>
        <line x1="1142" y1="830" x2="1520" y2="830" stroke="#4A4A4A" stroke-width="1.4"/>
        <path id="ghostLine" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
        <path id="tempLine" fill="none" stroke="#2196F3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="tempDot" r="4.5" fill="#2196F3"/>
        <text class="body" x="1142" y="622" fill="#8A8A8A" font-size="13" letter-spacing="3">TEMPERATURE</text>
        <text id="phaseLabel" class="body" x="1142" y="650" fill="#8A8A8A" font-size="12" letter-spacing="2" opacity="0">PLATEAU</text>
      </g>
    </svg>

    <!-- OVERLAY -->
    <div class="overlay">
      <div class="label display" id="heatIn"><span class="accent">HEAT</span> IN</div>
      <div class="label body" id="phase">Phase&nbsp;Change</div>
      <div class="label display" id="stable">TEMP&nbsp;STABLE</div>
      <div id="lockup">
        <div class="wordmark display">ThermoStore</div>
        <div class="tagline body">Peak&nbsp;Shaving</div>
      </div>
    </div>

    <div id="restart"><span class="dot"></span>Restart</div>
  </div>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var stage = document.getElementById('stage');
  var heatEl = document.getElementById('heat');
  var heatGlow = document.getElementById('heatGlow');
  var blockEl = document.getElementById('block');
  var meltGradRect = document.getElementById('meltGradRect');
  var meltFlowRect = document.getElementById('meltFlowRect');
  var meltLine = document.getElementById('meltLine');
  var blockClipRect = document.getElementById('blockClipRect');
  var tempLine = document.getElementById('tempLine');
  var tempDot = document.getElementById('tempDot');
  var ghostLine = document.getElementById('ghostLine');
  var phaseLabel = document.getElementById('phaseLabel');
  var arrowsGroup = document.getElementById('arrows');
  var heatIn = document.getElementById('heatIn');
  var phase = document.getElementById('phase');
  var stable = document.getElementById('stable');
  var lockup = document.getElementById('lockup');

  var BLOCK = {x:560, y:360, w:480, h:280};
  var BLOCK_TOP = 360, BLOCK_BOTTOM = 640;
  var G = {x:1142, y:830, w:378, h:182};
  var GRAPH_TOP = 648, GRAPH_BOTTOM = 830;
  var HEAT_BAR_H = 46;
  var HEAT_REST = -200;

  var tempPts = [
    [0.00, 0.15], [0.60, 0.15], [0.85, 0.20], [1.00, 0.40],
    [1.15, 0.66], [1.30, 0.86], [1.45, 0.95], [1.60, 0.98],
    [1.75, 0.985],[1.90, 0.99], [2.10, 0.99], [2.40, 0.99],
    [2.80, 0.99], [3.20, 0.99], [3.60, 0.99], [4.00, 0.99],
    [4.40, 0.985],[4.80, 0.98], [5.20, 0.97], [5.60, 0.96],
    [6.00, 0.95], [6.20, 0.90], [6.50, 0.80], [6.80, 0.62],
    [7.10, 0.44], [7.40, 0.28], [7.70, 0.19], [8.00, 0.15]
  ];
  var ghostPts = [
    [0.00, 0.15], [0.60, 0.15], [0.85, 0.20], [1.00, 0.40],
    [1.15, 0.66], [1.30, 0.86], [1.45, 0.95], [1.60, 0.98],
    [1.75, 0.985],[1.90, 0.99], [2.10, 0.99], [2.40, 0.99],
    [2.80, 0.99], [3.20, 0.99], [3.60, 0.99], [4.00, 0.99],
    [4.20, 0.995],[4.40, 1.00], [4.60, 1.00]
  ];

  // Build ghost path
  (function(){
    var d = "";
    for (var i=0;i<ghostPts.length;i++){
      var px = G.x + ghostPts[i][0]/8.0 * G.w;
      var py = G.y - ghostPts[i][1] * G.h;
      d += (i===0?"M":"L") + px.toFixed(1) + " " + py.toFixed(1) + " ";
    }
    ghostLine.setAttribute('d', d);
  })();

  // Build release arrows
  var arrows = [];
  (function(){
    var cx = BLOCK.x + BLOCK.w/2, cy = BLOCK.y + BLOCK.h/2;
    var N = 12;
    for (var i=0;i<N;i++){
      var ang = (i/N) * Math.PI*2 - Math.PI/2;
      var dx = Math.cos(ang), dy = Math.sin(ang);
      var hw = BLOCK.w/2, hh = BLOCK.h/2;
      var tx = (Math.abs(dx)<1e-6)?1e6:(hw/Math.abs(dx));
      var ty = (Math.abs(dy)<1e-6)?1e6:(hh/Math.abs(dy));
      var t = Math.min(tx,ty);
      var ex = cx + dx*t, ey = cy + dy*t;
      var g = document.createElementNS(NS,'g');
      var line = document.createElementNS(NS,'line');
      line.setAttribute('x1', ex.toFixed(1)); line.setAttribute('y1', ey.toFixed(1));
      line.setAttribute('x2', ex.toFixed(1)); line.setAttribute('y2', ey.toFixed(1));
      line.setAttribute('stroke','#2196F3'); line.setAttribute('stroke-width','2.4');
      line.setAttribute('stroke-linecap','round');
      g.appendChild(line);
      var head = document.createElementNS(NS,'path');
      head.setAttribute('fill','#2196F3');
      g.appendChild(head);
      arrowsGroup.appendChild(g);
      arrows.push({g:g, line:line, head:head, dx:dx, dy:dy, ex:ex, ey:ey});
    }
  })();

  // ---- Math helpers ----
  function clamp01(v){ return v<0?0:(v>1?1:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeInCubic(t){ return t*t*t; }
  function easeInOutCubic(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
  function easeOutExpo(t){ return t>=1?1:1-Math.pow(2,-10*t); }
  function easeInOutQuint(t){ return t<0.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2; }

  function tempYAt(t){
    var P = tempPts;
    if (t<=P[0][0]) return P[0][1];
    if (t>=P[P.length-1][0]) return P[P.length-1][1];
    for (var i=0;i<P.length-1;i++){
      if (t>=P[i][0] && t<=P[i+1][0]){
        var f = (t-P[i][0])/(P[i+1][0]-P[i][0]);
        return lerp(P[i][1], P[i+1][1], f);
      }
    }
    return P[0][1];
  }
  function tempPathUpTo(t){
    var P = tempPts;
    var d = "";
    for (var i=0;i<P.length;i++){
      if (P[i][0] > t) break;
      var px = G.x + P[i][0]/8.0 * G.w;
      var py = G.y - P[i][1] * G.h;
      d += (i===0?"M":"L") + px.toFixed(1) + " " + py.toFixed(1) + " ";
    }
    var px = G.x + t/8.0 * G.w;
    var py = G.y - tempYAt(t) * G.h;
    d += "L" + px.toFixed(1) + " " + py.toFixed(1);
    return d;
  }

  // ---- Main render ----
  function render(t){
    t = ((t % 8) + 8) % 8;

    // Heat bar
    var heatY, heatOp;
    if (t < 1.5){
      var p = clamp01((t-0.25)/1.25);
      var e = easeInOutCubic(p);
      heatY = lerp(HEAT_REST, BLOCK_TOP-HEAT_BAR_H, e);
      heatOp = clamp01(p*1.5);
    } else if (t < 4.0){
      var pp = (t-1.5)/2.5;
      heatY = (BLOCK_TOP-HEAT_BAR_H) - Math.sin(pp*Math.PI*3)*8;
      heatOp = 1;
    } else if (t < 5.0){
      var q = easeInCubic(clamp01((t-4.0)/1.0));
      heatY = lerp(BLOCK_TOP-HEAT_BAR_H, HEAT_REST, q);
      heatOp = 1-q;
    } else {
      heatY = HEAT_REST; heatOp = 0;
    }
    heatEl.setAttribute('transform','translate(0,'+heatY.toFixed(1)+')');
    heatEl.style.opacity = heatOp;
    heatGlow.style.transform = 'translate(-50%,'+(heatY+HEAT_BAR_H)+'px)';
    heatGlow.style.opacity = heatOp;

    // Melting
    var meltFrac;
    if (t < 1.5){ meltFrac = 0; }
    else if (t < 4.0){ meltFrac = easeInOutCubic((t-1.5)/2.5); }
    else if (t < 6.0){ meltFrac = 1; }
    else if (t < 7.0){ meltFrac = 1 - easeInOutQuint((t-6.0)/1.0); }
    else { meltFrac = 0; }
    var meltH = meltFrac * BLOCK.h;
    blockClipRect.setAttribute('height', Math.max(0.01, meltH).toFixed(2));
    meltGradRect.style.opacity = meltFrac;
    meltFlowRect.style.opacity = (meltFrac*0.9).toFixed(3);
    meltLine.style.opacity = (meltFrac>0.02 && meltFrac<0.995 ? 0.95 : 0).toFixed(3);
    meltLine.setAttribute('y', (BLOCK_TOP + meltH).toFixed(1));

    // Graph
    tempLine.setAttribute('d', tempPathUpTo(t));
    var dotX = G.x + t/8.0 * G.w;
    var dotY = G.y - tempYAt(t) * G.h;
    tempDot.setAttribute('cx', dotX.toFixed(1));
    tempDot.setAttribute('cy', dotY.toFixed(1));
    var ghostOp = (t>=4.0 && t<6.0) ? 0.55 : 0;
    ghostLine.style.opacity = ghostOp;
    phaseLabel.style.opacity = (t>=1.5 && t<4.0) ? 0.9 : 0;

    // Arrows
    var arrowOp = 0, arrowProg = 0;
    if (t>=6.0 && t<6.9){
      arrowProg = easeOutExpo(clamp01((t-6.0)/0.7));
      arrowOp = clamp01((t-6.0)/0.15);
    } else if (t>=6.9 && t<7.4){
      arrowProg = 1;
      arrowOp = 1 - (t-6.9)/0.5;
    }
    arrowsGroup.style.opacity = arrowOp;
    for (var i=0;i<arrows.length;i++){
      var a = arrows[i];
      var len = 26 * arrowProg;
      var tx = a.ex + a.dx*len, ty = a.ey + a.dy*len;
      a.line.setAttribute('x2', tx.toFixed(1));
      a.line.setAttribute('y2', ty.toFixed(1));
      var px = -a.dy, py = a.dx;
      var hs = 5*arrowProg;
      var d = "M"+tx.toFixed(1)+" "+ty.toFixed(1)+
              " L"+(tx-a.dx*hs+a.px*hs).toFixed(1)+" "+(ty-a.dy*hs+a.py*hs).toFixed(1)+
              " L"+(tx-a.dx*hs-a.px*hs).toFixed(1)+" "+(ty-a.dy*hs-a.py*hs).toFixed(1)+" Z";
      a.head.setAttribute('d', d);
    }

    // Labels
    var hiOp=0, hiX=0;
    if (t<0.25){ hiOp=0; hiX=-40; }
    else if (t<1.5){ var p=easeOutCubic((t-0.25)/1.25); hiOp=p; hiX=lerp(-40,0,p); }
    else if (t<1.8){ hiOp=1-(t-1.5)/0.3; hiX=0; }
    else { hiOp=0; hiX=0; }
    heatIn.style.opacity = hiOp;
    heatIn.style.transform = 'translate(calc(-50% + '+hiX.toFixed(1)+'px), calc(-50% - 150px))';

    var phOp=0;
    if (t<1.5){ phOp=0; }
    else if (t<2.0){ phOp=(t-1.5)/0.5; }
    else if (t<3.6){ phOp=1; }
    else if (t<4.0){ phOp=1-(t-3.6)/0.4; }
    else { phOp=0; }
    phase.style.opacity = phOp;
    phase.style.transform = 'translate(-50%, calc(-50% + 230px))';

    var stOp=0;
    if (t<4.0){ stOp=0; }
    else if (t<4.5){ stOp=(t-4.0)/0.5; }
    else if (t<6.0){ stOp=1; }
    else if (t<6.4){ stOp=1-(t-6.0)/0.4; }
    else { stOp=0; }
    stable.style.opacity = stOp;
    stable.style.transform = 'translate(-50%, calc(-50% + 230px))';

    var lkOp=0, lkScale=0.96;
    if (t<6.4){ lkOp=0; }
    else if (t<7.2){ var p=easeOutCubic((t-6.4)/0.8); lkOp=p; lkScale=lerp(0.96,1,p); }
    else if (t<7.6){ lkOp=1; lkScale=1; }
    else if (t<8.0){ lkOp=1-(t-7.6)/0.4; lkScale=1; }
    else { lkOp=0; }
    lockup.style.opacity = lkOp;
    lockup.style.transform = 'translate(-50%,-50%) scale('+lkScale.toFixed(3)+')';
  }

  // ---- Timing ----
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var start = null, rafId = null;

  if (reduced){
    render(1.5);
  } else {
    function loop(now){
      if (start===null) start = now;
      var t = (now - start) / 1000;
      render(t);
      rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);
  }

  function restart(){
    if (reduced) return;
    start = null;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  stage.addEventListener('click', restart);
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); restart(); }
  });
})();
</script>
</body>
</html>
