<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLAR FLARE CORONA VISUALIZATION — Helios-7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050505;
    --data:#888888;
    --data-dim:#565656;
    --flare:#ff4500;
    --peak:#fffacd;
    --gold:#ffd700;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--void);overflow:hidden}
  body{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    color:var(--data);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    cursor:default;
  }
  canvas#scene{position:fixed;inset:0;display:block;z-index:1;touch-action:none}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:10;pointer-events:none;font-weight:400}
  .hud *{pointer-events:none}
  .k{color:var(--data-dim)}
  .v{color:#c9c9c9;font-weight:500}
  .brk{
    position:absolute;width:11px;height:11px;
    border:1px solid rgba(136,136,136,.28);
  }
  .brk.tl{top:0;left:0;border-right:0;border-bottom:0}
  .brk.tr{top:0;right:0;border-left:0;border-bottom:0}
  .brk.bl{bottom:0;left:0;border-right:0;border-top:0}
  .brk.br{bottom:0;right:0;border-left:0;border-top:0}

  .hud-brand{top:26px;left:30px}
  .hud-brand .row1{
    font-size:11px;letter-spacing:.42em;color:#d2d2d2;font-weight:500;
    display:flex;align-items:center;gap:10px;
  }
  .hud-brand .row1 .tick{
    width:6px;height:6px;border-radius:50%;background:var(--flare);
    box-shadow:0 0 8px 1px var(--flare);
    animation:rec 2.4s ease-in-out infinite;
  }
  @keyframes rec{0%,100%{opacity:.35}50%{opacity:1}}
  .hud-brand .sub{
    margin-top:9px;font-size:9.5px;letter-spacing:.28em;color:var(--data-dim);
  }

  .hud-tel{top:26px;right:30px;text-align:right;font-size:10.5px;letter-spacing:.14em;line-height:1.95}
  .hud-tel .k{margin-right:14px}
  .hud-tel .v{font-variant-numeric:tabular-nums}

  .hud-flux{bottom:26px;left:30px;width:min(320px,58vw)}
  .hud-flux .lbl{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.24em;margin-bottom:9px}
  .hud-flux .lbl .k{color:var(--data-dim)}
  .bar{position:relative;height:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar i{
    position:absolute;inset:0;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,#7a1200,#ff4500 55%,#fffacd);
    box-shadow:0 0 10px rgba(255,69,0,.6);
    transition:transform .12s linear;
  }
  .hud-flux .note{margin-top:10px;font-size:9px;letter-spacing:.16em;color:var(--data-dim)}
  .hud-flux .note b{color:#c9c9c9;font-weight:500}

  .hud-legend{bottom:26px;right:30px;font-size:9px;letter-spacing:.16em;text-align:right;line-height:2.05;color:var(--data-dim)}
  .hud-legend .k{color:var(--data-dim)}
  .hud-legend .v{color:#a9a9a9;font-variant-numeric:tabular-nums}

  .hint{
    position:fixed;left:50%;bottom:64px;transform:translateX(-50%);
    z-index:11;pointer-events:none;text-align:center;
    font-size:10px;letter-spacing:.34em;color:#9a9a9a;
    opacity:0;transition:opacity 1.4s ease;
    text-transform:uppercase;
  }
  .hint.on{opacity:.9}
  .hint .pulse{color:var(--peak)}

  .vignette{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }

  @media (max-width:640px){
    .hud-brand{top:16px;left:16px}
    .hud-tel{top:16px;right:16px;font-size:9px;line-height:1.8}
    .hud-flux{bottom:16px;left:16px;width:56vw}
    .hud-legend{display:none}
    .hint{bottom:96px;font-size:9px;letter-spacing:.24em}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <header class="hud hud-brand" aria-label="Instrument brand">
    <div class="row1"><span class="tick"></span>HELIOS&#8209;7</div>
    <div class="sub">SOLAR FLARE CORONA VISUALIZATION</div>
  </header>

  <section class="hud hud-tel" aria-label="Telemetry">
    <div><span class="k">TEMP</span><span class="v" id="temp">0.00 MK</span></div>
    <div><span class="k">FLUX</span><span class="v" id="flux">0.00 &times;10&#8311; Mx</span></div>
    <div><span class="k">TENSION</span><span class="v" id="tension">0%</span></div>
    <div><span class="k">UPLINK</span><span class="v" id="uplink">NOMINAL</span></div>
  </section>

  <section class="hud hud-flux" aria-label="Magnetic pressure">
    <div class="lbl"><span class="k">MAGNETIC PRESSURE</span><span class="v" id="presVal">0%</span></div>
    <div class="bar"><i id="presBar"></i></div>
    <div class="note">STABILITY <b id="stab">NOMINAL</b> &nbsp;·&nbsp; PEAK <b id="peak">0.00 MK</b></div>
  </section>

  <aside class="hud hud-legend" aria-label="Instrument readout">
    <div><span class="k">CLASS</span> <span class="v" id="cls">—</span></div>
    <div><span class="k">PARTICLES</span> <span class="v" id="pc">0</span></div>
    <div><span class="k">EPOCH</span> <span class="v" id="epoch">T+00:00</span></div>
    <div><span class="k">LAT/LON</span> <span class="v">N18° / E143°</span></div>
  </aside>

  <div class="hint" id="hint">DRAG THE <span class="pulse">MAGNETIC POLES</span> TOGETHER — RELEASE TO TRIGGER A FLARE</div>

<script>
(function(){
  "use strict";
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha:false });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- state ----------
  let W=0,H=0,DPR=1,CX=0,CY=0,coreR=0,starScale=1;
  let time=0, startT=performance.now(), last=performance.now();
  let pressure=0, flareActive=false, flareEnergy=0, flareTimer=0;
  let shakeX=0, shakeY=0, audioReady=false, hum=null, humGain=null;
  let particles=[], sprites=[];
  let isMobile = matchMedia('(pointer:coarse)').matches || innerWidth<640;

  const MAXP = isMobile ? 240 : 620;
  const POLE_MIN = 0.035, POLE_MAX = 0.22; // fraction of min(W,H)
  const POLE_DY  = 0.055;

  // ---------- helpers ----------
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(a,b)=>a+Math.random()*(b-a);

  // ---------- sprite factory ----------
  function makeSprite(size, stops){
    const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d');
    const grd=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    stops.forEach(s=>grd.addColorStop(s[0],s[1]));
    g.fillStyle=grd; g.fillRect(0,0,size,size);
    return c;
  }
  function buildSprites(){
    sprites = {
      core: makeSprite(256,[[0,'rgba(255,255,255,1)'],[0.12,'rgba(255,246,214,0.95)'],[0.32,'rgba(255,215,0,0.55)'],[0.6,'rgba(255,110,20,0.16)'],[1,'rgba(255,69,0,0)']]),
      corona: makeSprite(512,[[0,'rgba(255,150,40,0.5)'],[0.25,'rgba(255,90,10,0.24)'],[0.5,'rgba(255,45,0,0.10)'],[0.75,'rgba(150,20,0,0.035)'],[1,'rgba(0,0,0,0)']]),
      glow: makeSprite(128,[[0,'rgba(255,235,180,0.9)'],[0.4,'rgba(255,120,20,0.35)'],[1,'rgba(255,69,0,0)']]),
      particle: makeSprite(64,[[0,'rgba(255,255,255,0.95)'],[0.3,'rgba(255,215,120,0.7)'],[1,'rgba(255,80,0,0)']])
    };
  }

  // ---------- magnetic poles ----------
  const poles = [
    {x:0,y:0,baseX:0,baseY:0,dragging:false},
    {x:0,y:0,baseX:0,baseY:0,dragging:false}
  ];
  function layoutPoles(){
    const d = lerp(POLE_MAX, POLE_MIN, pressure) * Math.min(W,H);
    const dy = POLE_DY * Math.min(W,H);
    poles[0].baseX = CX - d; poles[0].baseY = CY - dy;
    poles[1].baseX = CX + d; poles[1].baseY = CY - dy;
    if(!poles[0].dragging) poles[0].x = poles[0].baseX;
    if(!poles[1].dragging) poles[1].x = poles[1].baseX;
    poles[0].y = poles[0].baseY; poles[1].y = poles[1].baseY;
  }

  // ---------- resize ----------
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H/2;
    coreR = Math.min(W,H)*0.115;
    buildSprites();
    layoutPoles();
  }

  // ---------- audio ----------
  function initAudio(){
    if(audioReady) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      const ac = new AC();
      hum = ac.createOscillator(); hum.type='sine'; hum.frequency.value=42;
      humGain = ac.createGain(); humGain.gain.value=0;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180;
      hum.connect(humGain).connect(lp).connect(ac.destination);
      hum.start(); audioReady=true;
    }catch(e){}
  }
  function flareSound(strength){
    if(!audioReady) return;
    try{
      const ac = humGain.context, now=ac.currentTime;
      const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=120;
      const g=ac.createGain(); g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.12*strength, now+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.9);
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=300+strength*400;
      o.connect(bp).connect(g).connect(ac.destination);
      o.start(now); o.stop(now+1.0);
    }catch(e){}
  }

  // ---------- particles ----------
  function spawnBurst(x,y,energy){
    const n = Math.floor((isMobile?120:300)*energy);
    for(let i=0;i<n && particles.length<MAXP;i++){
      const a = rand(0,Math.PI*2);
      const sp = rand(1.2,6.5)*(0.4+energy);
      particles.push({
        x:x+rand(-6,6), y:y+rand(-6,6),
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - rand(0.5,2),
        life:1, decay:rand(0.006,0.018), size:rand(6,26)*(0.6+energy*0.6)
      });
    }
  }
  function updateParticles(dt){
    const g = coreR*0.0016;
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      const dx=CX-p.x, dy=CY-p.y, d2=dx*dx+dy*dy, d=Math.sqrt(d2)||1;
      p.vx += (dx/d)*g*(1+pressure*3);
      p.vy += (dy/d)*g*(1+pressure*3);
      p.vx*=0.985; p.vy*=0.985;
      p.x+=p.vx*dt*60; p.y+=p.vy*dt*60;
      p.life-=p.decay*dt*60;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  // ---------- flare ----------
  function triggerFlare(strength){
    flareActive=true; flareEnergy=strength; flareTimer=0;
    const mx=(poles[0].x+poles[1].x)/2, my=(poles[0].y+poles[1].y)/2;
    spawnBurst(mx,my,strength);
    if(!reduceMotion) shakeX=rand(-1,1)*strength*3; shakeY=rand(-1,1)*strength*3;
    flareSound(strength);
    flashPeak=Math.max(flashPeak, strength);
  }
  let flashPeak=0;

  // ---------- field line drawing ----------
  function drawFieldLines(){
    ctx.globalCompositeOperation='lighter';
    const p=poles[0], q=poles[1];
    const dist=Math.hypot(q.x-p.x,q.y-p.y);
    const span=q.x-p.x;
    const nArcs=6;
    const maxH = clamp(coreR*0.9 + dist*0.45, coreR*0.7, H*0.55);
    const bright = 0.5 + pressure*0.9;

    for(let i=0;i<nArcs;i++){
      const t = nArcs===1?0.5:i/(nArcs-1);
      const baseH = maxH*(0.32+0.68*t);
      const wob = reduceMotion?0:Math.sin(time*1.1 + i*1.7)*coreR*0.05;
      const apexY = Math.min(p.y,q.y) - baseH - wob;
      const apexX = (p.x+q.x)/2 + Math.sin(time*0.7+i)*coreR*0.06;
      const cx1 = p.x + span*0.12, cy1 = p.y - baseH*0.75;
      const cx2 = q.x - span*0.12, cy2 = q.y - baseH*0.75;

      // outer glow pass
      for(let pass=0; pass<2; pass++){
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.bezierCurveTo(cx1,cy1, cx2,cy2, q.x,q.y);
        const grd=ctx.createLinearGradient(p.x,p.y,q.x,apexY);
        if(pass===0){
          grd.addColorStop(0,'rgba(120,20,0,'+(0.10*bright)+')');
          grd.addColorStop(0.5,'rgba(255,69,0,'+(0.14*bright)+')');
          grd.addColorStop(1,'rgba(255,200,120,'+(0.10*bright)+')');
          ctx.strokeStyle=grd; ctx.lineWidth=(10-6*t)+8;
        }else{
          grd.addColorStop(0,'rgba(255,69,0,'+(0.5*bright)+')');
          grd.addColorStop(0.55,'rgba(255,150,40,'+(0.65*bright)+')');
          grd.addColorStop(1,'rgba(255,250,205,'+(0.85*bright)+')');
          ctx.strokeStyle=grd; ctx.lineWidth=(2.4-1.2*t);
        }
        ctx.lineCap='round';
        ctx.stroke();
      }

      // flowing plasma motes along the arc
      if(!reduceMotion){
        const motes=3;
        for(let m=0;m<motes;m++){
          let u=(time*0.25 + m/motes + i*0.13)%1;
          const pt=cubic(p.x,p.y,cx1,cy1,cx2,cy2,q.x,q.y,u);
          const e = Math.sin(u*Math.PI); // 0 at ends, 1 at apex
          const sz = (2+e*4)*bright;
          const col = e>0.6?'rgba(255,250,205,':'rgba(255,150,40,';
          ctx.globalAlpha=0.5*bright;
          ctx.drawImage(sprites.glow, pt.x-sz*3, pt.y-sz*3, sz*6, sz*6);
          ctx.globalAlpha=1;
          ctx.fillStyle=col+(0.9*bright)+')';
          ctx.beginPath(); ctx.arc(pt.x,pt.y,sz*0.6,0,6.283); ctx.fill();
        }
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  function cubic(x0,y0,x1,y1,x2,y2,x3,y3,t){
    const mt=1-t, a=mt*mt*mt, b=3*mt*mt*t, c=3*mt*t*t, d=t*t*t;
    return {x:a*x0+b*x1+c*x2+d*x3, y:a*y0+b*y1+c*y2+d*y3};
  }

  // ---------- poles ----------
  function drawPoles(){
    ctx.globalCompositeOperation='lighter';
    for(const p of poles){
      const r = coreR*0.16*(1+pressure*0.6);
      const pulse = reduceMotion?1:(1+Math.sin(time*3+p.baseX)*0.12);
      ctx.globalAlpha=0.9;
      ctx.drawImage(sprites.glow, p.x-r*3*pulse, p.y-r*3*pulse, r*6*pulse, r*6*pulse);
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(255,250,205,'+(0.8+pressure*0.2)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,r*0.5,0,6.283); ctx.fill();
      // ring
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle='rgba(255,120,40,'+(0.25+pressure*0.5)+')';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(p.x,p.y,r*(1.6+pressure*1.4),0,6.283); ctx.stroke();
      ctx.globalCompositeOperation='lighter';
    }
    ctx.globalCompositeOperation='source-over';
  }

  // ---------- particles ----------
  function drawParticles(){
    ctx.globalCompositeOperation='lighter';
    for(const p of particles){
      const a=p.life*p.life;
      const s=p.size*(0.4+p.life*0.8);
      ctx.globalAlpha=a;
      ctx.drawImage(sprites.particle, p.x-s, p.y-s, s*2, s*2);
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }

  // ---------- core ----------
  function drawCore(){
    const breathe = reduceMotion?1:(1+Math.sin(time*0.9)*0.035);
    const flash = flareActive?flareEnergy*0.4:0;
    const r = coreR*(1+flash)*breathe*starScale;

    ctx.globalCompositeOperation='lighter';
    // corona halo
    const cr = r*3.6;
    ctx.globalAlpha=0.9;
    ctx.drawImage(sprites.corona, CX-cr, CY-cr, cr*2, cr*2);
    // core
    const cr2 = r*1.9;
    ctx.globalAlpha=1;
    ctx.drawImage(sprites.core, CX-cr2, CY-cr2, cr2*2, cr2*2);
    ctx.globalCompositeOperation='source-over';

    // crisp hot center
    const cg=ctx.createRadialGradient(CX,CY,0,CX,CY,r*0.8);
    cg.addColorStop(0,'rgba(255,255,255,'+(0.95*starScale)+')');
    cg.addColorStop(0.5,'rgba(255,246,200,'+(0.7*starScale)+')');
    cg.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(CX,CY,r*0.8,0,6.283); ctx.fill();
  }

  // ---------- main loop ----------
  function frame(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;
    time += dt;

    // ignition
    const el=(now-startT)/1000;
    starScale = reduceMotion?1:clamp(el/2,0,1);
    starScale = starScale*starScale*(3-2*starScale); // smoothstep

    // physics
    layoutPoles();
    updateParticles(dt);

    // flare lifecycle
    if(flareActive){
      flareTimer+=dt;
      if(flareTimer>0.35){ pressure=Math.max(0,pressure-dt*0.6); }
      if(flareTimer>1.1){ flareActive=false; }
    }

    // screen shake
    if(!reduceMotion){
      shakeX*=0.86; shakeY*=0.86;
      if(Math.abs(shakeX)<0.05)shakeX=0;
      if(Math.abs(shakeY)<0.05)shakeY=0;
    }

    // ---- render ----
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#050505';
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawFieldLines();
    drawCore();
    drawPoles();
    drawParticles();

    ctx.restore();

    // audio hum tied to pressure
    if(audioReady && humGain){
      const target = 0.0001 + pressure*0.05 + (flareActive?flareEnergy*0.05:0);
      humGain.gain.value = lerp(humGain.gain.value, target, 0.08);
      hum.frequency.value = 42 + pressure*30;
    }

    updateHUD();
    requestAnimationFrame(frame);
  }

  // ---------- HUD ----------
  const el = id=>document.getElementById(id);
  let hudAcc=0;
  function updateHUD(){
    hudAcc++; if(hudAcc%3!==0) return;
    const temp = (1.2 + pressure*7 + (flareActive?flareEnergy*9:0)).toFixed(2);
    const flux = (pressure*4.5 + 0.2).toFixed(2);
    const tp = Math.round(pressure*100);
    el('temp').textContent = temp+' MK';
    el('flux').textContent = flux+' ×10¹⁹ Mx';
    el('tension').textContent = tp+'%';
    el('presVal').textContent = tp+'%';
    el('presBar').style.transform = 'scaleX('+pressure.toFixed(3)+')';
    const uplink = flareActive?'FLARE EVENT':(pressure>0.75?'CRITICAL':pressure>0.45?'ELEVATED':'NOMINAL');
    el('uplink').textContent = uplink;
    el('stab').textContent = uplink;
    el('pc').textContent = particles.length;
    const peak=Math.max(1.2,parseFloat(temp));
    el('peak').textContent = peak.toFixed(2)+' MK';
    const cls = flareActive ? ('X'+(1+Math.round(flareEnergy*8))) : (pressure>0.6?'M'+(1+Math.round(pressure*4)):'B'+(1+Math.round(pressure*3)));
    el('cls').textContent = cls;
    const secs=Math.floor((performance.now()-startT)/1000);
    const mm=String(Math.floor(secs/60)).padStart(2,'0'), ss=String(secs%60).padStart(2,'0');
    el('epoch').textContent='T+'+mm+':'+ss;
  }

  // ---------- input ----------
  let active=null, offX=0, offY=0;
  function pos(e){
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX, y:t.clientY};
  }
  function onDown(e){
    initAudio();
    const p=pos(e);
    let best=null,bd=1e9;
    for(const po of poles){
      const d=Math.hypot(p.x-po.x,p.y-po.y);
      if(d<bd){bd=d;best=po;}
    }
    if(bd < coreR*0.9){
      active=best; best.dragging=true; offX=best.x-p.x; offY=best.y-p.y;
      hideHint();
      canvas.style.cursor='grabbing';
      e.preventDefault();
    }
  }
  function onMove(e){
    if(!active) return;
    const p=pos(e);
    active.x = clamp(p.x+offX, 20, W-20);
    active.y = clamp(p.y+offY, 20, H-20);
    // pressure from pole proximity
    const d=Math.hypot(poles[1].x-poles[0].x, poles[1].y-poles[0].y);
    const minD=POLE_MIN*Math.min(W,H), maxD=POLE_MAX*Math.min(W,H);
    pressure = clamp((maxD-d)/(maxD-minD), 0, 1);
    e.preventDefault();
  }
  function onUp(){
    if(active){
      active.dragging=false;
      const strength=pressure;
      if(strength>0.34){ triggerFlare(strength); }
      active=null;
      canvas.style.cursor='default';
    }
  }
  canvas.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onUp);

  // ---------- hint ----------
  const hint=el('hint');
  function hideHint(){ hint.classList.remove('on'); }
  setTimeout(()=>{ if(!reduceMotion) hint.classList.add('on'); }, 1200);
  setTimeout(hideHint, 6500);

  // ---------- boot ----------
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
