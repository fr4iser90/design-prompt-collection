<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroTunnel — Ventilation Baffle Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0d0d0d;
    --steel:#333333;
    --cyan:#00f2ea;
    --red:#ff0055;
    --line:rgba(0,242,234,.16);
    --line-soft:rgba(255,255,255,.06);
    --ink:#e8ecee;
    --ink-dim:#7a8286;
    --panel:#131516;
    --edge:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--void);color:var(--ink);
    font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:"Roboto Mono",monospace}

  /* ---------- STAGE ---------- */
  .stage{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(120% 90% at 50% 42%, #141618 0%, #0b0b0b 55%, #050505 100%);}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 220px 40px rgba(0,0,0,.9);}
  canvas#sim{position:absolute;inset:0;display:block;width:100%;height:100%;}

  /* ---------- OVERLAY ---------- */
  .overlay{position:absolute;inset:0;pointer-events:none;z-index:5;}
  .overlay .blk{pointer-events:auto}

  .corner{position:absolute;width:16px;height:16px;border:2px solid var(--cyan);opacity:.55}
  .corner.tl{top:14px;left:14px;border-right:0;border-bottom:0}
  .corner.tr{top:14px;right:14px;border-left:0;border-bottom:0}
  .corner.bl{bottom:14px;left:14px;border-right:0;border-top:0}
  .corner.br{bottom:14px;right:14px;border-left:0;border-top:0}

  /* ---------- BRAND ---------- */
  .brand{position:absolute;top:26px;left:30px;max-width:min(46vw,420px)}
  .brand .tag{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.42em;
    color:var(--ink-dim);text-transform:uppercase;font-weight:500;margin-bottom:8px}
  .brand .tag .dot{width:7px;height:7px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);
    animation:blink 2.4s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
  .brand h1{font-weight:700;line-height:.82;letter-spacing:-.01em;font-size:clamp(38px,7.4vw,96px);
    color:#fff;text-transform:uppercase;
    text-shadow:0 0 30px rgba(0,242,234,.10);}
  .brand h1 .a{color:var(--cyan)}
  .brand .sub{margin-top:12px;font-size:12px;letter-spacing:.34em;color:var(--ink-dim);
    text-transform:uppercase;font-weight:500}
  .brand .sub b{color:var(--ink);font-weight:500}

  /* ---------- STATUS (top right) ---------- */
  .status{position:absolute;top:26px;right:30px;text-align:right;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-dim)}
  .status .row{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-bottom:7px}
  .status .led{width:8px;height:8px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .status .led.warn{background:var(--red);box-shadow:0 0 14px var(--red);animation:blink 1s steps(1) infinite}
  .status .mono{color:var(--ink);letter-spacing:.06em;font-size:12px}
  .status .sep{color:#3a3d3f}

  /* ---------- LEGEND (bottom right) ---------- */
  .legend{position:absolute;right:30px;bottom:132px;text-align:right;font-size:10.5px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);line-height:1.9}
  .legend .k{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
  .legend .sw{width:16px;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .legend .sw.r{background:var(--red);box-shadow:0 0 8px var(--red)}
  .legend .sw.s{background:#6a6f72;box-shadow:none}

  /* ---------- CONSOLE ---------- */
  .console{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    width:min(940px,calc(100vw - 40px));background:linear-gradient(180deg,#17191a,#101112);
    border:1px solid var(--edge);border-top:2px solid var(--cyan);
    box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);}
  .console .chead{display:flex;justify-content:space-between;align-items:center;
    padding:9px 18px;border-bottom:1px solid var(--line-soft);font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--ink-dim)}
  .console .chead .l{display:flex;align-items:center;gap:12px}
  .console .chead .tick{color:var(--cyan)}
  .console .chead .id{font-family:"Roboto Mono",monospace;color:#5c6164;letter-spacing:.12em}

  .cbody{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:18px 20px 20px;align-items:center}

  .readout{display:flex;flex-direction:column;gap:2px}
  .readout .lab{font-size:10px;letter-spacing:.32em;color:var(--ink-dim);text-transform:uppercase}
  .readout .big{display:flex;align-items:baseline;gap:6px}
  .readout .big .num{font-family:"Roboto Mono",monospace;font-weight:700;
    font-size:clamp(40px,7vw,64px);line-height:.9;color:#fff;letter-spacing:-.02em}
  .readout .big .deg{font-family:"Roboto Mono",monospace;font-size:22px;color:var(--cyan);
    text-shadow:0 0 14px rgba(0,242,234,.5)}
  .readout .state{margin-top:4px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--cyan);font-weight:500}
  .readout .state.warn{color:var(--red)}

  .ctrl{display:flex;flex-direction:column;gap:14px}
  .slider-row{display:flex;align-items:center;gap:16px}
  .slider-wrap{flex:1;position:relative;padding:6px 0}
  .scale{position:absolute;top:-4px;left:0;right:0;height:8px;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 10%);}
  .scale b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink-dim)}
  .scale b.hi{background:var(--red)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#2b2e30;
    outline:none;cursor:pointer;position:relative}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:26px;
    background:linear-gradient(180deg,#eef2f3,#8b9195);border:1px solid #000;
    box-shadow:0 0 0 1px rgba(0,242,234,.35),0 0 14px rgba(0,242,234,.35);cursor:grab}
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;box-shadow:0 0 0 1px var(--cyan),0 0 22px var(--cyan)}
  input[type=range]::-moz-range-thumb{width:16px;height:26px;border:1px solid #000;border-radius:0;
    background:linear-gradient(180deg,#eef2f3,#8b9195);box-shadow:0 0 0 1px rgba(0,242,234,.35),0 0 14px rgba(0,242,234,.35);cursor:grab}

  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:"Oswald",sans-serif;font-weight:500;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-dim);background:#1b1d1e;border:1px solid var(--edge);
    padding:8px 13px;cursor:pointer;transition:.18s;position:relative}
  .btn:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,242,234,.25)}
  .btn.active{color:#0a0a0a;background:var(--cyan);border-color:var(--cyan);
    box-shadow:0 0 16px rgba(0,242,234,.45)}
  .btn.danger:hover{color:#fff;border-color:var(--red);box-shadow:0 0 0 1px rgba(255,0,85,.3)}
  .btn.danger.active{background:var(--red);border-color:var(--red);color:#0a0a0a;
    box-shadow:0 0 16px rgba(255,0,85,.5)}
  .btn .k{font-family:"Roboto Mono",monospace;font-size:9px;opacity:.6;margin-left:6px}

  .hint{position:absolute;left:30px;bottom:132px;font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:#55595b}
  .hint b{color:var(--ink-dim)}

  @media (max-width:760px){
    .cbody{grid-template-columns:1fr;gap:14px}
    .legend,.hint{display:none}
    .brand{top:18px;left:18px}
    .status{top:18px;right:18px}
    .console{bottom:14px}
    .readout .big .num{font-size:44px}
  }
  @media (prefers-reduced-motion:reduce){
    .brand .tag .dot{animation:none}
    .status .led.warn{animation:none}
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="sim"></canvas>

    <div class="overlay">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <div class="brand blk">
        <div class="tag"><span class="dot"></span>Infrastructure · Ventilation Control</div>
        <h1><span class="a">Aero</span>Tunnel</h1>
        <div class="sub">Baffle Deflection Simulator · <b>Unit&nbsp;07</b> · Sector&nbsp;C</div>
      </div>

      <div class="status">
        <div class="row"><span>System</span><span class="mono">Online</span><span class="led" id="ledSys"></span></div>
        <div class="row"><span>Intake</span><span class="mono" id="stIntake">00000</span></div>
        <div class="row"><span>Exhaust</span><span class="mono" id="stExhaust">00000</span></div>
        <div class="row"><span class="sep">—</span><span class="mono" id="stMode">NOMINAL</span><span class="led" id="ledMode"></span></div>
      </div>

      <div class="hint">Drag slider · <b>1–4</b> presets · <b>Space</b> sweep</div>

      <div class="legend">
        <div class="k">Airflow<span class="sw"></span></div>
        <div class="k">Baffle steel<span class="sw s"></span></div>
        <div class="k">Hinge stress<span class="sw r"></span></div>
      </div>

      <div class="console blk">
        <div class="chead">
          <div class="l"><span class="tick">▮▮</span> Baffle Angle Control</div>
          <div class="id">AVB-07 / REV.C</div>
        </div>
        <div class="cbody">
          <div class="readout">
            <div class="lab">Baffle Angle</div>
            <div class="big"><span class="num" id="angNum">00</span><span class="deg">°</span></div>
            <div class="state" id="angState">Flow · Parallel</div>
          </div>
          <div class="ctrl">
            <div class="slider-row">
              <div class="slider-wrap">
                <div class="scale"><b style="left:0"></b><b style="left:50%"></b><b class="hi" style="left:100%"></b></div>
                <input type="range" id="angle" min="0" max="90" value="0" step="1" aria-label="Baffle angle in degrees">
              </div>
            </div>
            <div class="presets">
              <button class="btn active" data-a="0">Parallel<span class="k">1</span></button>
              <button class="btn" data-a="30">Guide<span class="k">2</span></button>
              <button class="btn" data-a="45">Deflect<span class="k">3</span></button>
              <button class="btn danger" data-a="90">Seal<span class="k">4</span></button>
              <button class="btn" id="sweep">Sweep<span class="k">SPC</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  let W=0,H=0,dpr=1, cx=0, cy=0, focal=0;
  const DEPTH=1000, FLOOR=170, CEIL=150;
  const BG=0.22, FG=0.72, BGZ=DEPTH*(1-BG), FGZ=DEPTH*(1-FG);
  const SPAN=1500, N=90;
  const MAXP = reduce ? 110 : 360;

  const COL = { cyan:'#00f2ea', red:'#ff0055' };
  const lerp=(a,b,t)=>a+(b-a)*t;
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  // ---- state ----
  let targetAngle=0, angle=0;
  let stress=0, stressTarget=0, pulse=0;
  let sweeping=false, sweepT=0, sweepDir=1;
  let spawnAcc=0, spawnInterval=0.02;
  let intake=0, exhaust=0, stIntake=0, stExhaust=0;
  let last=performance.now(), elapsed=0;

  // ---- particles ----
  const P=[];
  function reset(p){
    p.z = DEPTH*(0.05+Math.random()*0.88);
    const y0 = -FLOOR + Math.random()*2*FLOOR;
    p.y = y0*0.92 + (Math.random()*2-1)*FLOOR*0.14;
    p.x = -SPAN + Math.random()*SPAN*0.55;
    p.vx = 300 + Math.random()*150;
    p.vy = (Math.random()*2-1)*26;
    p.age=0; p.life=1; p.dead=false; p.scatter=false; p.sc=0;
    p.vortex=(Math.random()<0.28)?(Math.random()<0.5?-1:1):0;
    p.vort=(Math.random()*2-1)*2.2;
    p.turb=Math.random()*Math.PI*2;
    p.amb=Math.random()*0.45+0.25;
    p.thick=0.7+Math.random()*0.7;
  }
  function initParticles(){ P.length=0; for(let i=0;i<MAXP;i++){ const p={}; reset(p); p.x=-SPAN+Math.random()*SPAN*2; P.push(p);} }

  function project(x,y,z){ const s=focal/(focal+z); return {x:cx+x*s, y:cy+y*s, s}; }

  function updateParticle(p,dt){
    p.age+=dt;
    if(p.dead) return;
    const th=angle*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
    const nx=-s, ny=c, dot=p.vx*nx+p.vy*ny;
    const speed=Math.hypot(p.vx,p.vy)||1;
    if(dot<0){
      const hitX=0, hitY=p.y;
      const tt=(hitX-p.x)/p.vx;
      if(tt>0 && tt<dt){
        p.x=hitX; p.y=hitY;
        const nrm=clamp(-dot,0,1e9);
        if(nrm>speed*0.6){ // direct hit -> scatter
          p.scatter=true; p.sc=0.5+Math.random()*0.45;
          const sp=speed*(0.4+Math.random()*0.35);
          const dir=(p.y>=0)?1:-1;
          const ang=dir*(0.35+Math.random()*1.05);
          p.vx=Math.cos(ang)*sp; p.vy=Math.sin(ang)*sp;
          p.vortex=(Math.random()<0.6)?(Math.random()<0.5?-1:1):0;
          p.vort=(Math.random()*2-1)*3.2;
          p.life*=0.9; p.thick*=0.9;
        } else { // glancing -> reflect, speed up
          p.vx-=2*dot*nx; p.vy-=2*dot*ny;
          const boost=1.04+Math.random()*0.12;
          p.vx*=boost; p.vy*=boost;
        }
      }
    }
    if(p.scatter){
      p.sc-=dt;
      if(p.sc<=0){ p.scatter=false; p.vortex=0; }
    }
    if(p.vortex){ p.vx+=p.vortex*200*dt; p.vy+=p.vort*160*dt; }
    p.turb+=dt*4;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt + (p.vortex?0:Math.sin(p.turb)*9*dt);
    if(!p.scatter) p.vy*=0.99;

    if(p.x>SPAN || p.y>FLOOR || p.y<-FLOOR || p.age>9 || p.life<0.15){
      if(p.scatter && p.x>0 && p.y>-FLOOR && p.y<FLOOR) exhaust++;
      reset(p);
    }
  }

  // ---- baffle ----
  function bafflePoints(){
    const th=angle*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
    const half=150, t=16;
    const pts=[[-t,-half],[t,-half],[t,half],[-t,half]];
    return pts.map(([lx,ly])=>{
      const x=lx*c - ly*s, y=lx*s + ly*c;
      const p=project(x,y,FGZ);
      return {x:p.x,y:p.y,s:p.s};
    });
  }
  function quad(pts){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<4;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.closePath(); }

  function drawBaffle(){
    const pts=bafflePoints();
    // depth edge (thickness) toward viewer
    const e=project(0,0,FGZ-46);
    const depthPts=pts.map(p=>({x:p.x+(e.x-p.x)*0.16,y:p.y+(e.y-p.y)*0.16}));
    ctx.fillStyle='#1c1e1f';
    quad(depthPts); ctx.fill();

    // main face — brushed steel gradient
    const c0=project(0,-150,FGZ), c1=project(0,150,FGZ);
    const g=ctx.createLinearGradient(c0.x,c0.y,c1.x,c1.y);
    g.addColorStop(0,'#4a4f52'); g.addColorStop(.32,'#2c2f31');
    g.addColorStop(.5,'#565b5e'); g.addColorStop(.68,'#26292b'); g.addColorStop(1,'#414649');
    quad(pts); ctx.fillStyle=g; ctx.fill();

    // brushed streaks
    ctx.save(); quad(pts); ctx.clip();
    ctx.globalAlpha=.10; ctx.strokeStyle='#cfd4d6'; ctx.lineWidth=1;
    for(let i=-150;i<=150;i+=5){
      const a=project(-16,i,FGZ), b=project(16,i,FGZ);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.globalAlpha=.5; ctx.fillStyle='rgba(255,255,255,.10)';
    const hl=project(0,-150,FGZ), hl2=project(0,150,FGZ);
    ctx.fillRect(hl.x-3,hl.y,6,hl2.y-hl.y);
    ctx.restore();

    // sharp edges
    ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,255,255,.5)'; quad(pts); ctx.stroke();
    ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y); ctx.lineTo(pts[3].x,pts[3].y); ctx.stroke();

    // hinge
    const h=project(0,0,FGZ);
    const r=11*h.s;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const glow=stress*0.9 + pulse*0.5;
    const col = stress>0.55 ? COL.red : COL.cyan;
    const rg=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,r*6);
    rg.addColorStop(0, col); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=glow; ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(h.x,h.y,r*6,0,7); ctx.fill();
    ctx.restore();

    ctx.fillStyle='#0c0d0e'; ctx.beginPath(); ctx.arc(h.x,h.y,r,0,7); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle= stress>0.5?COL.red:'#8b9195';
    ctx.beginPath(); ctx.arc(h.x,h.y,r,0,7); ctx.stroke();
    ctx.fillStyle= stress>0.5?COL.red:COL.cyan;
    ctx.beginPath(); ctx.arc(h.x,h.y,r*0.35,0,7); ctx.fill();
  }

  // ---- background ----
  function drawBG(){
    ctx.fillStyle='#0d0d0d'; ctx.fillRect(0,0,W,H);
    const vp=project(0,0,DEPTH);
    // tunnel edges
    ctx.strokeStyle='rgba(0,242,234,.10)'; ctx.lineWidth=1;
    const edges=[[SPAN,-FLOOR],[SPAN,FLOOR],[-SPAN,-CEIL],[-SPAN,CEIL]];
    edges.forEach(([x,y])=>{ const a=project(x,y,-80), b=project(x,y,DEPTH);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
    // grid floor + ceiling
    ctx.strokeStyle='rgba(0,242,234,.09)';
    for(let x=-SPAN;x<=SPAN;x+=150){
      const a=project(x,FLOOR,0), b=project(x,FLOOR,DEPTH);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      const ca=project(x,-CEIL,0), cb=project(x,-CEIL,DEPTH);
      ctx.beginPath(); ctx.moveTo(ca.x,ca.y); ctx.lineTo(cb.x,cb.y); ctx.stroke();
    }
    for(let z=0;z<=DEPTH;z+=140){
      const a=project(-SPAN,FLOOR,z), b=project(SPAN,FLOOR,z);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      const ca=project(-SPAN,-CEIL,z), cb=project(SPAN,-CEIL,z);
      ctx.beginPath(); ctx.moveTo(ca.x,ca.y); ctx.lineTo(cb.x,cb.y); ctx.stroke();
    }
    // vanishing glow
    const vg=ctx.createRadialGradient(vp.x,vp.y,0,vp.x,vp.y,W*0.28);
    vg.addColorStop(0,'rgba(0,242,234,.10)'); vg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,242,234,.6)';
    ctx.beginPath(); ctx.arc(vp.x,vp.y,2,0,7); ctx.fill();
  }

  // ---- render ----
  function render(){
    drawBG();
    // back particles
    ctx.lineCap='round';
    for(const p of P){ if(p.z<FGZ) drawP(p); }
    drawBaffle();
    for(const p of P){ if(p.z>=FGZ) drawP(p); }
  }
  function drawP(p){
    const s=focal/(focal+p.z);
    const x1=project(p.x,p.y,p.z);
    const x2=project(p.x-p.vx*0.03,p.y-p.vy*0.03,p.z);
    const a=clamp(p.life,0,1)*(p.amb+0.45);
    ctx.globalAlpha=a;
    ctx.strokeStyle=COL.cyan;
    ctx.lineWidth=p.thick*s*1.4;
    ctx.beginPath(); ctx.moveTo(x2.x,x2.y); ctx.lineTo(x1.x,x1.y); ctx.stroke();
    // bright head
    ctx.globalAlpha=a; ctx.fillStyle='#d6fffd';
    ctx.beginPath(); ctx.arc(x1.x,x1.y,Math.max(0.6,p.thick*s*0.9),0,7); ctx.fill();
    ctx.globalAlpha=1;
  }

  // ---- loop ----
  function frame(now){
    let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05); elapsed+=dt;
    if(sweeping){
      sweepT+=dt;
      const cyc=clamp(sweepT/6,0,1);
      const a=reduce?0:easeIO(cyc)*90;
      targetAngle=a;
      if(sweepT>=6){ sweeping=false; sweepT=0; document.getElementById('sweep').classList.remove('active'); }
    }
    const ease = reduce?1:0.14;
    angle += (targetAngle-angle)*ease;
    stressTarget = Math.pow(clamp(angle/90,0,1),1.5);
    stress += (stressTarget-stress)*(reduce?1:0.1);
    pulse = stress>0.55 ? (0.5+0.5*Math.sin(elapsed*8))*stress : 0;

    // spawn
    if(!reduce){
      spawnAcc+=dt;
      while(spawnAcc>=spawnInterval){ spawnAcc-=spawnInterval;
        if(P.length<MAXP){ const p={}; reset(p); P.push(p); } }
    }
    for(const p of P) updateParticle(p,dt);

    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  // ---- HUD ----
  const angNum=document.getElementById('angNum'), angState=document.getElementById('angState');
  const stIntakeEl=document.getElementById('stIntake'), stExhaustEl=document.getElementById('stExhaust');
  const stMode=document.getElementById('stMode'), ledMode=document.getElementById('ledMode'), ledSys=document.getElementById('ledSys');
  const slider=document.getElementById('angle');
  const presetBtns=[...document.querySelectorAll('.btn[data-a]')];
  let hudT=0;
  function updateHUD(){
    angNum.textContent=Math.round(angle).toString().padStart(2,'0');
    slider.value=Math.round(angle);
    if(Math.abs(angle-targetAngle)>0.5) syncActive();
    hudT+=1;
    if(hudT%4===0){
      stIntakeEl.textContent=Math.round(stIntake).toString().padStart(5,'0');
      stExhaustEl.textContent=Math.round(stExhaust).toString().padStart(5,'0');
    }
    const st=stress;
    if(st>0.72){ angState.textContent='Sealed · Critical'; angState.classList.add('warn');
      stMode.textContent='OVERLOAD'; stMode.style.color=COL.red; ledMode.className='led warn'; }
    else if(st>0.45){ angState.textContent='Deflecting'; angState.classList.remove('warn');
      stMode.textContent='CAUTION'; stMode.style.color='#ffcf3a'; ledMode.className='led warn'; }
    else if(st>0.12){ angState.textContent='Guiding Flow'; angState.classList.remove('warn');
      stMode.textContent='NOMINAL'; stMode.style.color=COL.cyan; ledMode.className='led'; }
    else { angState.textContent='Flow · Parallel'; angState.classList.remove('warn');
      stMode.textContent='NOMINAL'; stMode.style.color=COL.cyan; ledMode.className='led'; }
    ledSys.className='led';
  }
  function syncActive(){
    const v=Math.round(targetAngle);
    presetBtns.forEach(b=>b.classList.toggle('active', +b.dataset.a===v));
  }

  // ---- events ----
  slider.addEventListener('input',()=>{ targetAngle=+slider.value; sweeping=false;
    document.getElementById('sweep').classList.remove('active'); syncActive(); });
  presetBtns.forEach(b=>b.addEventListener('click',()=>{ targetAngle=+b.dataset.a; sweeping=false;
    document.getElementById('sweep').classList.remove('active'); syncActive(); }));
  document.getElementById('sweep').addEventListener('click',function(){
    if(reduce){ targetAngle=90; syncActive(); return; }
    sweeping=!sweeping; sweepT=0; this.classList.toggle('active',sweeping); });

  addEventListener('keydown',e=>{
    if(e.key==='1')targetAngle=0; else if(e.key==='2')targetAngle=30;
    else if(e.key==='3')targetAngle=45; else if(e.key==='4')targetAngle=90;
    else if(e.code==='Space'){ e.preventDefault(); sweeping=!sweeping; sweepT=0;
      document.getElementById('sweep').classList.toggle('active',sweeping); }
    if(['1','2','3','4'].includes(e.key)) syncActive();
  });

  // ---- resize ----
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=canvas.clientWidth; H=canvas.clientHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=W/2; cy=H*0.46; focal=W*0.95;
  }
  addEventListener('resize',resize);

  // ---- intake/exhaust counters ----
  setInterval(()=>{ stIntake=Math.round((1-stressTarget)*92000+8000+Math.random()*400);
    stExhaust=Math.round(stressTarget*14000+Math.random()*300); },220);

  // ---- boot ----
  resize(); initParticles(); syncActive();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
