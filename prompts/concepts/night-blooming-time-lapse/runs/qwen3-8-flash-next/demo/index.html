<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Blooming Time-Lapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#030508;
    --plum:#2e1f2b;
    --petal:#a8dadc;
    --stamen:#e0d5c1;
    --ease:cubic-bezier(.42,0,.58,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--sky);
    color:var(--petal);
    font-family:"Cormorant Garamond",Georgia,serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ---------- STAGE ---------- */
  .stage{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #0b1220 0%, #060a12 30%, var(--sky) 62%, #010203 100%);
  }

  /* ---------- MOON GLOW ---------- */
  .moon-glow{
    position:absolute;
    top:-14vmax;
    left:50%;
    transform:translateX(-50%);
    width:60vmax;height:60vmax;
    border-radius:50%;
    background:radial-gradient(circle at 50% 42%,
      rgba(180,214,226,.20) 0%,
      rgba(150,190,205,.08) 26%,
      rgba(90,120,140,.03) 46%,
      rgba(3,5,8,0) 66%);
    pointer-events:none;
    animation:moonBreathe 17s ease-in-out infinite;
  }
  @keyframes moonBreathe{
    0%,100%{opacity:.72;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.06)}
  }

  /* ---------- STARS ---------- */
  .stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .star{
    position:absolute;
    background:#eaf4f7;
    border-radius:50%;
    box-shadow:0 0 4px 1px rgba(190,220,230,.55);
    opacity:.4;
    animation:twinkle var(--dur,5s) ease-in-out var(--del,0s) infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:.9;transform:scale(1.15)}
  }

  /* ---------- DEPTH OF FIELD ---------- */
  .dof{
    position:absolute;inset:0;
    pointer-events:none;
    backdrop-filter:blur(1.4px);
    -webkit-backdrop-filter:blur(1.4px);
    -webkit-mask-image:radial-gradient(circle at 50% 56%, transparent 20%, rgba(0,0,0,.55) 46%, #000 74%);
            mask-image:radial-gradient(circle at 50% 56%, transparent 20%, rgba(0,0,0,.55) 46%, #000 74%);
  }

  /* ---------- SCENE / FLOWER ---------- */
  .scene{
    position:relative;
    width:min(66vmin,440px);
    aspect-ratio:1/1;
    transform-origin:50% 100%;
    animation:sway 13s ease-in-out infinite;
    filter:drop-shadow(0 34px 46px rgba(0,0,0,.65));
  }
  @keyframes sway{
    0%,100%{transform:rotate(-1.1deg)}
    50%{transform:rotate(1.1deg)}
  }

  .flower{position:absolute;inset:0;animation:fadeCycle 13s ease-in-out infinite}
  @keyframes fadeCycle{
    0%{opacity:0}
    5%{opacity:1}
    95%{opacity:1}
    100%{opacity:0}
  }

  .petal{
    position:absolute;
    left:50%;top:50%;
    width:44%;height:60%;
    transform-origin:50% 100%;
    background:linear-gradient(to top,
      var(--plum) 0%,
      #5c4653 38%,
      #8fb6bd 74%,
      var(--petal) 100%);
    border-radius:50% 50% 46% 46% / 62% 62% 40% 40%;
    box-shadow:
      inset 0 12px 22px rgba(255,255,255,.12),
      inset 0 -26px 34px rgba(10,6,12,.6);
    opacity:0;
    animation:
      openCycle var(--dur,13s) var(--ease) var(--del,0s) infinite,
      fadeCycle 13s ease-in-out infinite;
  }
  @keyframes openCycle{
    0%   {transform:translate(-50%,-100%) rotate(var(--b0)) scale(.5);opacity:0}
    6%   {opacity:.92}
    55%  {transform:translate(-50%,-100%) rotate(var(--b1)) scale(.96)}
    80%  {transform:translate(-50%,-100%) rotate(var(--b2)) scale(1);opacity:1}
    94%  {transform:translate(-50%,-100%) rotate(var(--b2)) scale(1);opacity:1}
    100% {transform:translate(-50%,-100%) rotate(var(--b0)) scale(.5);opacity:0}
  }

  .center{
    position:absolute;
    left:50%;top:50%;
    width:16%;height:16%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 50% 40%,
      #f4ecd8 0%, var(--stamen) 34%, #6d5a44 78%, #2a1f22 100%);
    box-shadow:
      0 0 12px 2px rgba(224,213,193,.28),
      inset 0 -4px 6px rgba(20,12,10,.6);
    opacity:0;
    animation:centerCycle 13s var(--ease) infinite, fadeCycle 13s ease-in-out infinite;
  }
  @keyframes centerCycle{
    0%,52%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    80%{transform:translate(-50%,-50%) scale(1);opacity:1}
    94%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  }

  /* ---------- VIGNETTE ---------- */
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 52%,
      transparent 44%, rgba(1,2,4,.55) 78%, rgba(0,0,0,.9) 100%);
  }

  /* ---------- TEXT ---------- */
  .title{
    position:absolute;
    left:50%;top:12.5%;
    transform:translateX(-50%);
    text-align:center;
    z-index:6;
    pointer-events:none;
    animation:titleCycle 13s ease-in-out infinite;
  }
  @keyframes titleCycle{
    0%{opacity:0;transform:translateX(-50%) translateY(10px)}
    22%{opacity:.6;transform:translateX(-50%) translateY(0)}
    42%{opacity:1;transform:translateX(-50%) translateY(0)}
    84%{opacity:1;transform:translateX(-50%) translateY(0)}
    98%{opacity:0;transform:translateX(-50%) translateY(-6px)}
    100%{opacity:0;transform:translateX(-50%) translateY(-6px)}
  }
  .title .wordmark{
    font-size:clamp(1.7rem,4.6vw,3.5rem);
    font-weight:300;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--petal);
    text-shadow:0 0 34px rgba(168,218,220,.35);
    line-height:1.05;
  }
  .title .sub{
    display:block;
    margin-top:.9rem;
    font-style:italic;
    font-weight:300;
    font-size:clamp(.85rem,1.7vw,1.15rem);
    letter-spacing:.12em;
    color:rgba(168,218,220,.72);
  }
  .title .rule{
    display:block;
    width:64px;height:1px;
    margin:1.1rem auto 0;
    background:linear-gradient(to right,transparent,rgba(168,218,220,.6),transparent);
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce){
    .moon-glow,.scene,.flower,.petal,.center,.title,.star{
      animation:none !important;
      opacity:1 !important;
    }
    .petal{transform:translate(-50%,-100%) rotate(var(--b2)) scale(1) !important}
    .center{transform:translate(-50%,-50%) scale(1) !important}
    .title{transform:translateX(-50%) !important}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="moon-glow"></div>
    <div class="stars" id="stars"></div>
    <div class="dof"></div>

    <div class="scene">
      <div class="flower" id="flower">
        <div class="center"></div>
      </div>
    </div>

    <div class="vignette"></div>

    <div class="title">
      <span class="wordmark">Night Blooming Time-Lapse</span>
      <span class="rule"></span>
      <span class="sub">a secret, only the moonlight knows</span>
    </div>
  </div>

<script>
  (function(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DUR = 13;

    /* ---- Build petals: two concentric layers, back-to-front ---- */
    var flower = document.getElementById('flower');
    var center = flower.querySelector('.center');

    function makePetal(base, spread, open, z, dur, delay){
      var p = document.createElement('div');
      p.className = 'petal';
      p.style.setProperty('--b0', (base - spread) + 'deg');
      p.style.setProperty('--b1', (base - spread + (open + spread) * 0.55) + 'deg');
      p.style.setProperty('--b2', (base + open) + 'deg');
      p.style.zIndex = z;
      p.style.setProperty('--dur', dur + 's');
      p.style.setProperty('--del', delay + 's');
      flower.insertBefore(p, center);
    }

    // Outer layer — 12 petals, opens first (slower, earlier)
    var N_OUT = 12;
    for (var i = 0; i < N_OUT; i++){
      var a = (360 / N_OUT) * i;
      makePetal(a, 20, 62, 10 + i, DUR, 0.0);
    }
    // Inner layer — 12 petals, staggered, opens later (faster)
    var N_IN = 12;
    for (var j = 0; j < N_IN; j++){
      var a2 = (360 / N_IN) * j + (360 / N_IN / 2);
      makePetal(a2, 16, 42, 40 + j, DUR * 0.9, 0.35);
    }

    /* ---- Stars ---- */
    var starField = document.getElementById('stars');
    var COUNT = 140;
    var frag = document.createDocumentFragment();
    for (var s = 0; s < COUNT; s++){
      var st = document.createElement('div');
      st.className = 'star';
      var size = (Math.random() * 1.7 + 0.5).toFixed(2);
      st.style.width = size + 'px';
      st.style.height = size + 'px';
      st.style.left = (Math.random() * 100).toFixed(2) + '%';
      st.style.top = (Math.random() * 100).toFixed(2) + '%';
      if (reduce){
        st.style.opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
      } else {
        st.style.setProperty('--dur', (Math.random() * 5 + 3.5).toFixed(2) + 's');
        st.style.setProperty('--del', (Math.random() * 6).toFixed(2) + 's');
      }
      frag.appendChild(st);
    }
    starField.appendChild(frag);
  })();
</script>
</body>
</html>
